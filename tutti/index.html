<style>
.back{display:inline-block;font-weight:700;text-decoration:none;margin-bottom:18px}
.back:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:3px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:28px}
.hero h1{font-size:clamp(84px,28vw,150px)}
.hero svg{width:clamp(70px,22vw,110px);height:auto;flex:0 0 auto;margin-bottom:8px;transform:rotate(8deg)}
.stack{display:grid;gap:14px}
.row{display:flex;gap:12px}
.row input{flex:1;min-width:0}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.topline .back{margin:0}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.cta button{font-size:clamp(28px,9vw,38px);font-weight:800;font-stretch:75%;letter-spacing:-.01em;line-height:1;padding:30px 8px;border-radius:20px}
.cta .primary{box-shadow:5px 5px 0 var(--pink)}
.cta .primary:hover:not(:disabled){box-shadow:7px 7px 0 var(--pink)}
.solo{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;background:var(--pink);color:var(--ink);
  padding:18px 20px;border-radius:20px;transform:rotate(-.7deg);margin-top:10px}
.solo b{font-size:34px;font-weight:800;font-stretch:75%;line-height:1}
.solo small{font-size:15px;font-weight:600}
.subrow{display:flex;justify-content:center;margin-top:6px}
#codeIn{text-transform:uppercase;letter-spacing:.25em;font-weight:800;text-align:center;font-size:44px;font-stretch:75%;padding:14px 10px}
.rech{font-size:clamp(60px,20vw,96px);margin:0 0 18px}
.rec{display:flex;align-items:center;gap:14px;background:var(--white);border:var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.rec .rn{min-width:58px;text-align:center}
.rec .rn b{display:block;font-size:40px;font-weight:800;font-stretch:75%;line-height:1}
.rec .rn small{font-size:12px;font-weight:600}
.rec .ri{flex:1;min-width:0;font-weight:700;line-height:1.2}
.rec .ri small{display:block;font-weight:500;font-size:14px}
.rec button{padding:8px 14px;font-size:16px;box-shadow:none}
.emp{font-weight:600}
.bar .snd,.topline .snd{margin-left:auto}
.snd[aria-pressed=false]{text-decoration-line:line-through}
#homeMsg{min-height:30px;margin:14px 0 0;font-weight:600}
#homeMsg.bad{width:fit-content;background:var(--pink);padding:2px 12px;border-radius:99px}
.spark{transform-origin:170px 32px;animation:flick .3s infinite alternate}
@keyframes flick{to{transform:scale(.7) rotate(20deg)}}

/* barra superior (sala y partida) */
.bar{display:flex;align-items:center;gap:20px;margin-bottom:12px;font-weight:700;font-size:16px}
.bar a,.linkbtn{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:3px}
.linkbtn{background:none;border:0;box-shadow:none;padding:2px 0;font:inherit;font-weight:700;cursor:pointer}
.linkbtn:hover:not(:disabled),.linkbtn:active:not(:disabled){transform:none;box-shadow:none;text-decoration-color:var(--pink)}

/* fichas de jugador */
.tok{width:50px;height:50px;border-radius:50%;border:var(--line);background:var(--bg);color:var(--fg);display:grid;place-items:center;
  font-weight:800;font-size:22px;flex:0 0 auto;transition:transform .2s,box-shadow .2s}
.tok.sm{width:38px;height:38px;font-size:17px}

/* paneles desplegables */
details.panel{background:var(--white);border:var(--line);border-radius:16px;padding:0 16px;margin-top:14px}
details.panel summary{cursor:pointer;font-weight:700;padding:13px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;border-radius:10px}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+";font-weight:800;font-size:24px;line-height:1}
details.panel[open] summary::after{content:"−"}
details.panel summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.body{padding:0 0 16px;font-size:16px;line-height:1.45}
.body h3{font-size:17px;margin:18px 0 6px;font-weight:800}
.body h3:first-child{margin-top:2px}
.body p{margin:0 0 8px}
.body dl{margin:0}
.body dt{font-weight:700;margin-top:10px}
.body dd{margin:2px 0 0}
.ex{font-weight:700;background:var(--paper);border-radius:6px;padding:0 5px;white-space:nowrap}

/* sala */
.codecard{background:var(--white);border:var(--line);border-radius:20px;box-shadow:var(--hard);padding:18px 20px 20px;transform:rotate(-1.2deg);margin-bottom:22px}
.codecard .display{font-size:clamp(76px,26vw,120px);letter-spacing:.06em;margin-bottom:14px}
.codecard .row button{flex:1;padding:12px 10px}
.plist{display:grid;gap:10px;margin-bottom:24px}
.prow{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700}
.prow .tag{font-size:15px;font-weight:600;margin-left:auto;opacity:.7}
.prow.wait{opacity:.5}
.prow .kick{padding:5px 12px;font-size:14px;box-shadow:none;background:transparent;color:var(--ink);border-width:2px}
.prow .kick:hover:not(:disabled),.prow .kick:active:not(:disabled){transform:none;box-shadow:none;background:var(--pink)}
.set{display:grid;gap:6px;margin-bottom:16px}
.set label,.set .lbl{font-size:15px;font-weight:700}
.set.off{opacity:.4;pointer-events:none}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 6px;box-shadow:none;background:transparent;color:var(--ink);font-size:16px;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:hover:not(:disabled),.seg button:active:not(:disabled){transform:none;box-shadow:none}
.seg button:disabled{opacity:1;cursor:default}
.seg button:disabled:not(.on){opacity:.4}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;padding:6px 0;box-shadow:none;background:transparent;color:var(--ink);font-size:22px;line-height:1}
.stepper button:hover:not(:disabled),.stepper button:active:not(:disabled){transform:none;box-shadow:none}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper b{min-width:64px;text-align:center;font-size:20px}
#cfgMore .body{padding-top:4px}
#lobbyHint{text-align:center;font-weight:600;margin:14px 0 0;min-height:24px}
#soloRec{font-weight:600;margin:0 0 16px}
#cfgSum{font-weight:600;margin:0 0 18px;opacity:.75}
#cfgBasic:empty{display:none}

/* partida */
#game .top{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
#flash{position:fixed;inset:0;background:var(--pink);opacity:0;pointer-events:none;z-index:5}
#flash.go{animation:fl .55s ease-out}
@keyframes fl{from{opacity:.6}to{opacity:0}}
#strip{position:relative;padding-top:56px;margin-top:6px}
#players{display:flex;flex-wrap:wrap;justify-content:center;gap:56px 10px}
#players.many{gap:50px 8px}
#players.many .pl{width:62px}
#players.many .tok{width:40px;height:40px;font-size:18px}
#players.many .nm{max-width:62px;font-size:12px}
.pl{display:flex;flex-direction:column;align-items:center;width:78px;text-align:center}
.pl.turn .tok{transform:scale(1.22);box-shadow:var(--hard)}
.pl .nm{font-size:14px;font-weight:700;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.pl.turn .nm{margin-top:9px}
.dots{display:flex;gap:3px;min-height:9px;margin-top:3px;font-size:12px;font-weight:600}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.pl.out{opacity:.35}
.pl.out .nm{text-decoration:line-through}
.pl.off{opacity:.5}
.pl.hit .tok{animation:hit .5s}
@keyframes hit{25%{transform:rotate(-14deg) scale(1.2)}60%{transform:rotate(14deg) scale(1.2)}}
#bomb{position:absolute;left:0;top:0;width:46px;z-index:3;pointer-events:none;opacity:0}
#bomb svg{display:block;width:100%;height:auto}
#bomb.boom svg{animation:boom .5s ease-out}
@keyframes boom{40%{transform:scale(2.4) rotate(12deg)}100%{transform:scale(1)}}

#stage{container-type:inline-size;background:var(--white);border:var(--line);border-radius:26px;box-shadow:var(--hard);
  padding:14px 14px 18px;margin-top:10px;text-align:center;transform:rotate(-.6deg)}
#stage.shake{animation:sshake .4s}
@keyframes sshake{20%{transform:rotate(-.6deg) translateX(-9px)}40%{transform:rotate(-.6deg) translateX(9px)}60%{transform:rotate(-.6deg) translateX(-5px)}80%{transform:rotate(-.6deg) translateX(5px)}}
#syl{font-weight:800;font-stretch:75%;font-size:min(36cqw,160px);line-height:.95;text-transform:uppercase;letter-spacing:.01em;min-height:.95em}
#syl.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7) rotate(-4deg)}to{transform:none}}
#entry{position:relative;margin-top:12px;min-height:1.4em}
#tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;font-size:min(44px,calc(88cqw / (var(--n,7) * 1.2)));min-height:1.35em}
.t{width:1.05em;height:1.3em;display:grid;place-items:center;border:3px solid var(--ink);border-radius:.2em;background:var(--white);
  font-weight:800;text-transform:uppercase;line-height:1}
.t.s{background:var(--pink)}
.caret{width:.1em;height:1.3em;background:var(--ink);align-self:center;margin:0 2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#word{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:none;box-shadow:none;font-size:16px;padding:0;cursor:text}
#word:disabled{pointer-events:none}
#fuse{height:14px;border:var(--line);border-radius:99px;margin-top:16px;overflow:hidden}
#fuse i{display:block;height:100%;width:100%;background:var(--pink)}
#send{margin-top:14px}
#msg{display:block;width:fit-content;min-height:30px;margin:14px auto 0;padding:2px 14px;border-radius:99px;font-weight:700;font-size:17px}
#msg.ok{background:var(--mint)}
#msg.bad{background:var(--pink)}
#letters{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:16px}
#letters span{width:24px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:700;text-transform:uppercase;
  border:2px solid #17140f40;color:#17140f60}
#letters span.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* resultados */
#over{position:fixed;inset:0;background:#17140f99;display:grid;place-items:center;z-index:10;padding:16px}
#over .box{background:var(--white);border:var(--line);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:24px 22px;max-width:400px;width:100%;
  max-height:92dvh;overflow:auto;transform:rotate(-.8deg)}
#over .display{font-size:clamp(46px,14vw,70px);margin-bottom:18px;word-break:break-word}
#rank{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:12px}
.who summary,.who.plain{display:flex;align-items:center;gap:12px}
.who summary{cursor:pointer;list-style:none;border-radius:10px}
.who summary::-webkit-details-marker{display:none}
.who summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.who summary::after{content:"+";margin-left:auto;font-weight:800;font-size:22px;line-height:1}
.who[open] summary::after{content:"−"}
.who .n{width:16px;font-weight:800;font-size:18px;text-align:center}
.who b{display:block;font-size:19px;line-height:1.1}
.who small{display:block;font-size:15px;font-weight:500;line-height:1.2}
.log{display:flex;flex-wrap:wrap;gap:8px 14px;margin:12px 0 2px 28px;font-size:16px;font-weight:600}
.pair{white-space:nowrap}
.chip{background:var(--pink);border:var(--line);border-radius:10px;padding:1px 10px;font-weight:800;font-size:18px;flex:0 0 auto}
.chip.sm{font-size:12px;padding:0 6px;border-width:2px;border-radius:7px;margin-right:6px;vertical-align:1px}
#fails{margin:0 0 18px;display:grid;gap:8px}
#fails h4{margin:0;font-size:15px;font-weight:700}
.fail{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;text-align:center}
.stats div{border:var(--line);border-radius:14px;padding:8px 4px}
.stats div.new{background:var(--pink)}
.stats b{display:block;font-size:36px;font-weight:800;font-stretch:75%;line-height:1}
.stats small{font-size:13px;font-weight:600}
#over .big+.big{margin-top:12px}
#overHint{text-align:center;font-weight:600;margin:12px 0 0}
/* tutti frutti */
#letterCard{container-type:inline-size;background:var(--white);border:var(--line);border-radius:26px;box-shadow:var(--hard);padding:12px 16px 16px;margin-top:10px;text-align:center;transform:rotate(-.6deg)}
#letter{font-weight:800;font-stretch:75%;font-size:min(46cqw,150px);line-height:.95}
#letter.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
#clock{font-weight:700;font-size:17px;min-height:26px;margin-top:6px}
#fuse{height:14px;border:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
#fuse i{display:block;height:100%;width:100%;background:var(--pink)}
#fields{display:grid;gap:10px;margin:18px 0 16px}
.fld{display:grid;gap:3px}
.fld span{font-weight:700;font-size:15px}
.fld input{font-size:20px;padding:10px 14px}
.fld input.bad{background:#ff5c8a55}
.fld input:disabled{opacity:.7}
button.pink{background:var(--pink);color:var(--ink)}
#rvHead{font-weight:600;margin:16px 0 12px;display:flex;justify-content:space-between;gap:10px}
.rcat{background:var(--white);border:var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.rcat h4{margin:0 0 8px;font-size:17px;font-weight:800}
.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--ink);border:2px solid transparent;border-radius:12px;
  box-shadow:none;padding:6px 8px;font-weight:600;font-size:18px;margin-bottom:4px}
.rrow:hover:not(:disabled),.rrow:active:not(:disabled){transform:none;box-shadow:none;border-color:var(--ink)}
.rrow:disabled{opacity:1;cursor:default}
.rrow .ra{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.15}
.rrow small{display:block;font-size:13px;font-weight:500}
.rrow .pts{font-weight:800;background:var(--mint);border-radius:99px;padding:0 10px;font-size:16px}
.rrow.no .ra{text-decoration:line-through;opacity:.55}
.rrow.no .pts{background:var(--pink)}
.rrow.flagged{border-color:var(--pink)}
.sc{display:grid;gap:8px;margin:6px 0 16px}
.sc div{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px}
.sc em{margin-left:auto;font-style:normal;font-size:24px;font-weight:800;font-stretch:75%}
.sc small{font-size:14px;font-weight:600;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cat{display:inline-flex;align-items:center;gap:6px;border:var(--line);border-radius:99px;padding:3px 12px;font-weight:700;font-size:16px;background:var(--white)}
.cat button{padding:0 2px;border:0;background:none;box-shadow:none;color:var(--ink);font-size:20px;line-height:1}
.cat button:hover:not(:disabled){transform:none;box-shadow:none;color:var(--pink)}
#catAddRow{margin-top:10px}
.rline{margin:10px 0 2px 28px;font-size:15px;font-weight:600;line-height:1.3}
.rline .z{text-decoration:line-through;opacity:.5}
</style>

</main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const MAX_PLAYERS = 8;
const COLORS = [['#ff5c8a','#17140f'],['#3b5bff','#fffef8'],['#2fd08a','#17140f'],['#ff8a3d','#17140f'],
                ['#8b5cf6','#fffef8'],['#17140f','#ffd93d'],['#fffef8','#17140f'],['#22c3e6','#17140f']];

// ---------- red ----------
// Supabase Realtime, solo broadcast: no hay tablas ni base de datos y las salas existen mientras haya alguien conectado.

  p.on = false;
  const live = H.players.filter(x => x.on).length;
  if (H.phase === 'play' || H.phase === 'collect' || H.phase === 'review') {
    if (live < 2) { endGame(); return; }
    if (H.phase === 'collect' && allIn(H.part)) { finishCollect(); return; }
    if (H.phase === 'review') { const on = H.players.filter(x => x.on && H.part.includes(x.id)); if (on.length && on.every(x => H.ready.has(x.id))) { endReview(); return; } computeReview(); }
  }
  push();
}
function kick(id) {
  if (!isHost || id === 'host' || !byId(id)) return;
  netPub('to/' + id, { t: 'kicked' });
  hostLeft(id, true);
}
function hostRecv(m, f) {
  if (!m || typeof m !== 'object') return;
  lastSeen[f] = now();
  if (m.t === 'hello') {
    const p = byId(f);
    if (p) { netPub('to/' + f, { t: 'state', s: pub() }); return; }
    if (H.phase !== 'lobby' && H.phase !== 'ended') { netPub('to/' + f, { t: 'started' }); return; }
    if (H.players.filter(x => x.on).length >= MAX_PLAYERS) { netPub('to/' + f, { t: 'full' }); return; }
    addPlayer(f, m.name); evt({ k: 'join', name: byId(f).name }); push();
  } else if (m.t === 'bye') hostLeft(f);
  else if (byId(f)) fromPlayer(f, m);
}

// ---------- conexión ----------
function setHome(text, kind) { const m = $('#homeMsg'); m.textContent = text || ''; m.className = kind || ''; }
function fail(msg) { if (/Sin conexión/.test(msg)) PGT.ev('net_fail'); netClose(); setHome(msg, 'bad'); show('home'); for (const b of ['#btnCreate', '#btnSolo', '#btnJoin', '#btnJoinInvite']) $(b).disabled = false; }

async function createRoom() {
  room = randCode(); myId = 'host'; isHost = true; solo = false;
  net.onMsg = hostRecv;
  try { await netOpen('host'); } catch (e) { isHost = false; fail('Sin conexión con los servidores. Revisa tu internet y prueba de nuevo.'); return; }
  H = newH(); addPlayer('host', myName);
  PGT.ev('room_create');
  history.replaceState(null, '', '?sala=' + room);
  net.timers.push(setInterval(() => {
    bcast({ t: 'hb' });
    const t = now();
    for (const p of H.players.slice()) if (p.id !== 'host' && p.on && t - (lastSeen[p.id] || 0) > DEAD) hostLeft(p.id);
  }, BEAT));
  push();
}
function startSolo() {
  myName = nameIn.value.trim() || 'Tú';
  if (nameIn.value.trim()) localStorage.setItem('jt_name', myName);
  solo = true; isHost = true; myId = 'host'; room = '';
  H = newH(); H.solo = true; addPlayer('host', myName);
  history.replaceState(null, '', location.pathname);
  setHome(''); push();
}
async function joinRoom(code) {
  room = code; isHost = false; solo = false; myId = uid(10); lastV = -1; gotState = false;
  net.onMsg = onMsg;
  try { await netOpen('guest'); } catch (e) { fail('Sin conexión con los servidores. Revisa tu internet y prueba de nuevo.'); return; }
  lastHeard = now();
  const hello = () => netPub('host', { t: 'hello', name: myName });
  hello(); let tries = 0;
  const h = setInterval(() => {
    if (gotState) { clearInterval(h); return; }
    if (++tries > 6) { clearInterval(h); fail('No se encontró esa sala. Revisa el código.'); return; }
    hello();
  }, 1500);
  net.timers.push(h);
  net.timers.push(setInterval(() => {
    netPub('host', { t: 'ping' });
    if (gotState && now() - lastHeard > DEAD) hostGone('Se perdió la conexión con la sala.');
  }, BEAT));
}
function hostGone(why) {
  if (isHost) return;
  netClose(); S = null;
  $('#rank').innerHTML = ''; $('#btnExit').hidden = true;
  $('#over').hidden = false; $('#overTitle').textContent = 'Sala cerrada'; $('#overHint').textContent = why || '';
  const b = $('#btnAgain'); b.textContent = 'Salir'; b.onclick = goHome;
}
function goHome() { location.href = location.pathname; }
function leave() {
  if (isHost && !solo && H && H.players.some(p => p.on && p.id !== 'host') && !confirm('Si sales, la sala se cierra para todos. ¿Salir?')) return;
  if (net.clients.length) netPub(isHost ? 'all' : 'host', { t: isHost ? 'closed' : 'bye' });
  setTimeout(goHome, 150);
}
function onMsg(m) {
  if (!m) return;
  if (!isHost) lastHeard = now();
  if (m.t === 'state') {
    if (m.s.v <= lastV) return;
    lastV = m.s.v; if (!gotState) PGT.ev('room_join'); gotState = true; applyState(m.s);
  } else if (m.t === 'evt') showEvent(m.e);
  else if (m.t === 'full') fail('La sala está llena.');
  else if (m.t === 'started') fail('La partida ya ha empezado.');
  else if (m.t === 'kicked') { netClose(); location.href = location.pathname + '?e=k'; }
  else if (m.t === 'closed') hostGone('El anfitrión ha cerrado la sala.');
}
function act(m) { if (isHost) fromPlayer('host', m); else netPub('host', m); }

// ---------- UI ----------
function show(id) { for (const s of ['home', 'lobby', 'game']) $('#' + s).hidden = s !== id; $('#bar').hidden = id === 'home'; }
function link() { const u = new URL(location.href); u.search = '?sala=' + room; u.hash = ''; return u.toString(); }

function applyState(s) {
  const prev = S ? S.phase : null;
  S = s; endAt = now() + s.left; total = Math.max(1, s.total || 1);
  if (s.phase === 'ended' && prev !== 'ended') play((s.solo ? s.res && s.res.solo && s.res.solo.isNew : s.res && s.res.rank[0] && s.res.rank[0].id === myId) ? 'win' : 'lose');
  const me = s.players.find(p => p.id === myId);
  const inLobby = s.phase === 'lobby' || (s.phase === 'ended' && me && me.back);
  if (s.phase === 'lobby' || s.phase === 'ended') { fieldsRound = -1; collectSent = -1; }
  if (inLobby) { show('lobby'); $('#over').hidden = true; renderLobby(); }
  else { show('game'); renderGame(); }
}

function ctlSeg(k, vals, labels, val) {
  return `<div class="seg" role="group">` + vals.map((v, i) =>
    `<button type="button" data-k="${k}" data-i="${i}" class="${v === val ? 'on' : ''}" ${isHost ? '' : 'disabled'} aria-pressed="${v === val}">${labels[i]}</button>`).join('') + '</div>';
}
function renderLobby() {
  if (!S) return;
  const ended = S.phase === 'ended', c = S.settings;
  const sl = !!S.solo;
  $('#lobbyCode').textContent = room;
  $('#codecard').hidden = sl; $('#plist').hidden = sl; $('#soloRec').hidden = !sl;
  if (sl) { const r = loadRec()[recKey(c)]; $('#soloRec').innerHTML = r ? `Récord con estos ajustes: <b>${r}</b> puntos` : 'Aún no hay récord con estos ajustes'; }
  $('#plist').innerHTML = S.players.filter(p => p.on || !ended).map(p => {
    const wait = ended && !p.back;
    const tag = wait ? 'viendo resultados' : p.id === 'host' ? 'anfitrión' : (p.id === myId ? 'tú' : '');
    const kick = isHost && p.id !== 'host' ? `<button type="button" class="kick" data-kick="${esc(p.id)}" aria-label="Echar a ${esc(p.name)}">Echar</button>` : '';
    return `<div class="prow ${wait ? 'wait' : ''}">${tok(p)}<span>${esc(p.name)}</span><span class="tag">${tag}</span>${kick}</div>`;
  }).join('');
  $('#cfgSum').textContent = `${c.rounds} rondas · ${c.time} s · ${c.cats.length} categorías`;
  $('#cfgSet').innerHTML =
    `<div class="set"><span class="lbl">Rondas</span>${ctlSeg('rounds', ROUND_OPTS, ROUND_OPTS.map(String), c.rounds)}</div>` +
    `<div class="set"><span class="lbl">Tiempo por ronda</span>${ctlSeg('time', TIME_OPTS, TIME_OPTS.map(t => t + ' s'), c.time)}</div>`;
  $('#cats').innerHTML = c.cats.map((n, i) => `<span class="cat">${esc(n)}${isHost && c.cats.length > MIN_CATS ? `<button type="button" data-del="${i}" aria-label="Quitar ${esc(n)}">×</button>` : ''}</span>`).join('');
  $('#catAddRow').hidden = !isHost || c.cats.length >= MAX_CATS; $('#btnCatReset').hidden = !isHost;
  $('#btnStart').hidden = !isHost;
  if (isHost) {
    const count = S.players.filter(p => p.on).length;
    $('#btnStart').disabled = count < (sl ? 1 : 2);
    $('#lobbyHint').textContent = !sl && count < 2 ? 'Comparte el enlace para empezar.' : '';
  } else $('#lobbyHint').textContent = 'Esperando al anfitrión…';
}

function readFields() { return [...document.querySelectorAll('#fields input')].map(i => i.value); }
function buildFields(s) {
  fieldsRound = s.round;
  $('#fields').innerHTML = s.settings.cats.map((n, i) =>
    `<label class="fld"><span>${esc(n)}</span><input type="text" data-i="${i}" maxlength="40" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" enterkeyhint="${i === s.settings.cats.length - 1 ? 'done' : 'next'}"></label>`).join('');
  const f = document.querySelector('#fields input'); if (f) setTimeout(() => f.focus(), 40);
  play('turn');
}
function updateStop() {
  const ins = [...document.querySelectorAll('#fields input')], L = S ? S.letter : '';
  let all = ins.length > 0;
  for (const i of ins) {
    const v = i.value.trim(), ok = v && startsOk(v, L);
    i.classList.toggle('bad', !!v && !ok);
    if (!ok) all = false;
  }
  $('#btnStop').disabled = !(S && S.phase === 'play' && !S.stopper && all);
}
function sendAns() { clearTimeout(ansTm); ansTm = setTimeout(() => act({ t: 'ans', a: readFields() }), 250); }

function renderGame() {
  const s = S, inPlay = s.phase === 'play' || s.phase === 'collect';
  $('#gCode').textContent = s.solo ? 'Individual' : room; $('#gInfo').textContent = `Ronda ${s.round}/${s.rounds}`;
  const L = $('#letter'); L.textContent = s.letter;
  if (s.letter !== lastLetter) { L.classList.remove('pop'); void L.offsetWidth; L.classList.add('pop'); lastLetter = s.letter; }
  $('#form').hidden = s.phase === 'review'; $('#review').hidden = s.phase !== 'review';
  $('#letterCard').hidden = false;
  if (inPlay) {
    if (fieldsRound !== s.round) buildFields(s);
    for (const i of document.querySelectorAll('#fields input')) i.disabled = s.phase !== 'play';
    updateStop();
  }
  if (s.phase === 'collect' && collectSent !== s.round) {
    collectSent = s.round; clearTimeout(ansTm);
    setTimeout(() => act({ t: 'ans', a: readFields(), fin: 1 }), 0);
  }
  if (s.phase === 'review') renderReview(s);
  const over = $('#over');
  if (s.phase === 'ended') { over.hidden = false; renderResults(s); } else over.hidden = true;
}

function renderReview(s) {
  const rv = s.rv; if (!rv) return;
  $('#rvCats').innerHTML = rv.cats.map((c, ci) => `<div class="rcat"><h4>${esc(c.name)}</h4>` + (c.rows.length ? c.rows.map(r => {
    const p = s.players.find(q => q.id === r.id) || { name: '?', color: 0 };
    const tag = !r.ok ? 'No empieza por ' + s.letter : r.fl.length ? (s.solo ? 'No vale' : r.fl.length + ' en contra') : '';
    return `<button type="button" class="rrow ${r.valid ? '' : 'no'} ${r.fl.includes(myId) ? 'flagged' : ''}" data-c="${ci}" data-id="${esc(r.id)}" ${(r.id === myId && !s.solo) || !r.ok ? 'disabled' : ''}>` +
      `${tok(p, 'sm')}<span class="ra">${esc(r.a)}${tag ? `<small>${esc(tag)}</small>` : ''}</span><span class="pts">+${r.pts}</span></button>`;
  }).join('') : '<p class="emp">Nadie ha respondido.</p>') + '</div>').join('');
  $('#rvScore').innerHTML = s.players.filter(p => p.on || s.rv.pts[p.id]).slice()
    .sort((a, b) => (b.score + (rv.pts[b.id] || 0)) - (a.score + (rv.pts[a.id] || 0)))
    .map(p => `<div>${tok(p, 'sm')}<span>${esc(p.name)}</span><em>${p.score + (rv.pts[p.id] || 0)}</em><small>+${rv.pts[p.id] || 0}</small></div>`).join('');
  const me = s.players.find(p => p.id === myId), act_ = s.players.filter(p => p.on);
  $('#btnReady').textContent = me && me.ready ? 'Esperando a los demás' : (s.round >= s.rounds ? 'Ver resultados' : 'Listo');
  $('#rvHint').textContent = s.solo ? '' : `${act_.filter(p => p.ready).length} de ${act_.length} listos`;
  $('#rvHead span').textContent = s.solo ? 'Toca las respuestas que no valgan.' : 'Toca una respuesta si no vale.';
}

function renderResults(s) {
  const r = s.res || { rank: [], rounds: [] };
  const top = r.rank[0], winners = r.rank.filter(x => top && x.score === top.score);
  const nm = id => (s.players.find(p => p.id === id) || { name: '?' }).name;
  $('#overTitle').textContent = s.solo && r.solo ? r.solo.score + ' puntos' : !top ? 'Fin' : winners.length > 1 ? 'Empate' : (top.id === myId ? 'Has ganado' : 'Gana ' + nm(top.id));
  $('#rank').innerHTML = r.rank.map((x, i) => {
    const p = s.players.find(q => q.id === x.id); if (!p) return '';
    const lines = r.rounds.map((rd, ri) => {
      const items = (rd.by[x.id] || []).map(([c, a, pts]) => `<span class="${pts ? '' : 'z'}">${esc(c)}: ${esc(a)}</span>`).join(' · ') || '<span class="z">sin respuestas</span>';
      return `<div class="rline"><span class="chip sm">${esc(rd.letter)}</span><b>${x.rounds[ri]}</b> · ${items}</div>`;
    }).join('');
    return `<li><details class="who"><summary><span class="n">${i + 1}</span>${tok(p, 'sm')}<div><b>${esc(p.name)}</b><small>${x.score} puntos</small></div></summary>${lines}</details></li>`;
  }).join('');
  const b = $('#btnAgain'); b.textContent = 'Jugar de nuevo';
  b.onclick = () => { if (isHost) { const p = byId('host'); if (p) { p.back = true; push(); } } else act({ t: 'again' }); };
  $('#btnExit').hidden = false;
  $('#overHint').textContent = s.solo && r.solo ? (r.solo.isNew ? '¡Nuevo récord!' : 'Récord: ' + r.solo.rec + ' puntos') : '';
}

let msgTm = 0;
function say(text, cls) { const m = $('#msg'); m.textContent = text; m.className = cls || ''; clearTimeout(msgTm); msgTm = setTimeout(() => { m.textContent = ''; m.className = ''; }, 3200); }
function showEvent(e) {
  if (e.k === 'join') { play('join'); say(e.name + ' entra'); }
  else if (e.k === 'left') { play('left'); say(e.name + (e.kicked ? ' expulsado' : ' se va')); }
  else if (e.k === 'stop') { play('bad'); say('¡Basta de ' + e.name + '!', 'bad'); }
}

// reloj
(function loop() {
  requestAnimationFrame(loop);
  if (!S) return;
  const rem = Math.max(0, endAt - now()), sec = Math.ceil(rem / 1000);
  if (S.phase === 'play') {
    $('#fuse').firstElementChild.style.width = Math.max(0, Math.min(100, rem / total * 100)) + '%';
    const st = S.stopper ? (S.players.find(p => p.id === S.stopper) || {}).name : '';
    $('#clock').textContent = st ? `Basta de ${st} · ${sec}` : sec + ' s';
    if (sec !== lastSec && sec <= 5 && sec > 0) play('tick', true);
  } else if (S.phase === 'collect') { $('#fuse').firstElementChild.style.width = '0%'; $('#clock').textContent = 'Recogiendo respuestas…'; }
  else if (S.phase === 'review') { $('#rvClock').textContent = S.solo ? '' : sec + ' s'; $('#clock').textContent = ''; }
  lastSec = sec;
})();

// ---------- eventos ----------
for (const id of ['#howHome', '#howLobby']) $(id).innerHTML = HOW;
const nameIn = $('#name');
nameIn.value = localStorage.getItem('jt_name') || '';
const params = new URLSearchParams(location.search);
const inviteCode = (params.get('sala') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
if (inviteCode.length === 4) { $('#homeCreate').hidden = true; $('#homeInvite').hidden = false; $('#inviteCode').textContent = inviteCode; }
if (params.get('e') === 'k') setHome('Te han expulsado de la sala.', 'bad');

function getName() {
  const n = nameIn.value.trim();
  if (!n) { setHome('Escribe tu nombre.', 'bad'); nameIn.focus(); return null; }
  localStorage.setItem('jt_name', n); myName = n; setHome(''); return n;
}
function busy() { for (const b of ['#btnCreate', '#btnSolo', '#btnJoin', '#btnJoinInvite']) $(b).disabled = true; setHome('Conectando…'); }
$('#btnCreate').onclick = () => { if (getName()) { busy(); createRoom(); } };
$('#btnSolo').onclick = startSolo;
$('#btnJoinOpen').onclick = () => { $('#homeCreate').hidden = true; $('#homeJoin').hidden = false; setHome(''); $('#codeIn').focus(); };
$('#btnJoinBack').onclick = () => { $('#homeJoin').hidden = true; $('#homeCreate').hidden = false; setHome(''); };
$('#btnJoin').onclick = () => {
  const c = $('#codeIn').value.toUpperCase().replace(/[^A-Z]/g, '');
  if (c.length !== 4) { setHome('El código tiene 4 letras.', 'bad'); return; }
  if (getName()) { busy(); joinRoom(c); }
};
$('#btnJoinInvite').onclick = () => { if (getName()) { busy(); joinRoom(inviteCode); } };
$('#btnCopy').onclick = async () => {
  const b = $('#btnCopy');
  try { await navigator.clipboard.writeText(link()); b.textContent = 'Copiado'; } catch (e) { prompt('Copia el enlace:', link()); }
  setTimeout(() => b.textContent = 'Copiar enlace', 1500);
};
if (navigator.share) { $('#btnShare').hidden = false; $('#btnShare').onclick = () => navigator.share({ title: 'Tutti frutti', url: link() }).catch(() => {}); }
$('#btnStart').onclick = startGame;
$('#btnLeave').onclick = leave;
$('#btnExit').onclick = leave;
$('#cfgSet').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b || !isHost) return;
  const k = b.dataset.k, i = +b.dataset.i;
  setSetting(k, (k === 'rounds' ? ROUND_OPTS : TIME_OPTS)[i]);
});
$('#cats').addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (b && isHost) catDel(+b.dataset.del); });
$('#btnCatAdd').onclick = () => { if (isHost) { catAdd($('#catIn').value); $('#catIn').value = ''; $('#catIn').focus(); } };
$('#catIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#btnCatAdd').click(); } });
$('#btnCatReset').onclick = () => { if (isHost) catReset(); };
$('#plist').addEventListener('click', e => { const b = e.target.closest('[data-kick]'); if (b && isHost) kick(b.dataset.kick); });
$('#fields').addEventListener('input', () => { updateStop(); sendAns(); });
$('#fields').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; e.preventDefault();
  const ins = [...document.querySelectorAll('#fields input')], i = ins.indexOf(e.target);
  if (i >= 0 && i < ins.length - 1) ins[i + 1].focus(); else if (!$('#btnStop').disabled) $('#btnStop').click();
});
$('#btnStop').onclick = () => { if (!$('#btnStop').disabled) { $('#btnStop').disabled = true; act({ t: 'stop', a: readFields() }); } };
$('#form').addEventListener('submit', e => e.preventDefault());
$('#rvCats').addEventListener('click', e => { const b = e.target.closest('.rrow'); if (b && !b.disabled) act({ t: 'flag', c: +b.dataset.c, id: b.dataset.id }); });
$('#btnReady').onclick = () => act({ t: 'ready' });
for (const b of document.querySelectorAll('.snd')) b.onclick = () => {
  unlock(); SND.mute = !SND.mute;
  try { localStorage.setItem('jt_mute', SND.mute ? '1' : '0'); } catch (e) {}
  paintSnd(); play('join');
};
addEventListener('pointerdown', unlock, true);
addEventListener('keydown', unlock, true);
paintSnd();
$('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnJoin').click(); });
addEventListener('pagehide', () => { if (net.clients.length) netPub(isHost ? 'all' : 'host', { t: isHost ? 'closed' : 'bye' }); });
nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') (inviteCode.length === 4 ? $('#btnJoinInvite') : $('#btnCreate')).click(); });
})();
</script>
</body>
