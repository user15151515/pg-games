<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const MAX_PLAYERS = 8, MAX_LIVES = 5, BONUS = 'abcdefghilmnopqrstuv';
// [fondo, texto]
const COLORS = [['#ff5c8a','#17140f'],['#3b5bff','#fffef8'],['#2fd08a','#17140f'],['#ff8a3d','#17140f'],
                ['#8b5cf6','#fffef8'],['#17140f','#ffd93d'],['#fffef8','#17140f'],['#22c3e6','#17140f']];

// ---------- red ----------
// Los mensajes pasan por brokers MQTT públicos (WebSocket seguro). No depende de la red de cada jugador.
// Cada cliente se conecta a todos los brokers a la vez y publica por todos; los duplicados se descartan,
// así que basta con que uno funcione para los dos lados.
const BROKERS = window.PG_BROKERS || [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081'
];
const TOPIC = 'pg/bomba/v1/';
const BEAT = 3000, DEAD = 20000;
const uid = n => { const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; let s = ''; for (let i = 0; i < n; i++) s += a[Math.random() * a.length | 0]; return s; };
const net = { clients: [], seq: 0, seen: new Set(), order: [], onMsg: null, timers: [] };

function envelope(m, q) { return JSON.stringify({ f: myId, q: q === undefined ? ++net.seq : q, m }); }
function netPub(suffix, m) {
  if (!net.clients.length) return;
  const s = envelope(m);
  for (const c of net.clients) if (c.connected) { try { c.publish(TOPIC + room + '/' + suffix, s, { qos: 0 }); } catch (e) {} }
}
function netRaw(buf) {
  let e; try { e = JSON.parse(buf.toString()); } catch (x) { return; }
  if (!e || typeof e !== 'object' || !e.m) return;
  const key = e.f + ':' + e.q;
  if (net.seen.has(key)) return;
  net.seen.add(key); net.order.push(key);
  if (net.order.length > 800) net.seen.delete(net.order.shift());
  net.onMsg(e.m, e.f);
}
function netOpen(role) {
  netClose();
  const will = role === 'host'
    ? { topic: TOPIC + room + '/all',  payload: JSON.stringify({ f: 'host', q: 'w', m: { t: 'closed' } }), qos: 0 }
    : { topic: TOPIC + room + '/host', payload: JSON.stringify({ f: myId, q: 'w', m: { t: 'bye' } }), qos: 0 };
  return new Promise((resolve, reject) => {
    let done = false;
    const fin = ok => { if (done) return; done = true; clearTimeout(to); ok ? resolve() : reject(new Error('net')); };
    const to = setTimeout(() => fin(false), 9000);

    setTimeout(() => { const el = document.querySelector('.pl[data-id="' + CSS.escape(String(e.id)) + '"]'); if (el) el.classList.add('hit'); }, 30);
  } else if (e.k === 'join') { play('join'); say(e.name + ' entra'); }
  else if (e.k === 'left') { play('left'); say(e.name + (e.kicked ? ' expulsado' : ' se va')); }
}
function badInput(m) {
  play('bad'); say(m, 'bad'); const st = $('#stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); $('#word').select();
}

// la bomba salta de ficha en ficha y tiembla más cuanto menos mecha queda
let bx = null, by = 0, nextTick = 0;
(function loop() {
  requestAnimationFrame(loop);
  const b = $('#bomb'); if (!b) return;
  if (!S || S.phase !== 'playing') { b.style.opacity = 0; bx = null; return; }
  const t = document.querySelector('.pl.turn .tok');
  if (!t) { b.style.opacity = 0; return; }
  const r = t.getBoundingClientRect(), st = $('#strip').getBoundingClientRect();
  const tx = r.left - st.left + r.width / 2 - b.offsetWidth / 2, ty = r.top - st.top - b.offsetHeight + 2;
  if (bx === null) { bx = tx; by = ty; }
  bx += (tx - bx) * 0.2; by += (ty - by) * 0.2;
  const dist = Math.hypot(tx - bx, ty - by), hop = Math.min(dist, 140) * 0.35;
  const rem = Math.max(0, (fuseEnd - now()) / 1000), T = Math.min(8, fuseTotal / 1000 * 0.7);
  const amp = rem < T ? (T - rem) / T * 5 : 0;
  b.style.opacity = 1;
  b.style.transform = `translate(${bx + (Math.random() - .5) * amp}px,${by - hop + (Math.random() - .5) * amp}px)`;
  if (rem > 0 && now() >= nextTick) { play('tick', S.turn === myId); nextTick = now() + (rem > 6 ? 1000 : rem > 3 ? 500 : rem > 1.5 ? 250 : 125); }
  const fz = $('#fuse');
  if (!fz.hidden) fz.firstElementChild.style.width = Math.max(0, Math.min(100, rem * 1000 / fuseTotal * 100)) + '%';
})();

// ---------- eventos de la interfaz ----------
for (const id of ['#howHome', '#howLobby']) $(id).innerHTML = HOW;
const nameIn = $('#name');
nameIn.value = localStorage.getItem('jt_name') || '';
const params = new URLSearchParams(location.search);
const inviteCode = (params.get('sala') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
if (inviteCode.length === 4) { $('#homeCreate').hidden = true; $('#homeInvite').hidden = false; $('#inviteCode').textContent = inviteCode; }
if (params.get('e') === 'k') setHome('Te han expulsado de la sala.', 'bad');

function getName() {
  const n = nameIn.value.trim();
  if (!n) { setHome('Escribe tu nombre.', 'bad'); nameIn.focus(); return null; }
  localStorage.setItem('jt_name', n); myName = n; setHome(''); return n;
}
function busy() { for (const b of ['#btnCreate', '#btnSolo', '#btnJoin', '#btnJoinInvite']) $(b).disabled = true; setHome('Conectando…'); }
$('#btnCreate').onclick = () => { if (getName()) { busy(); createRoom(); } };
$('#btnSolo').onclick = () => startSolo();
$('#btnJoinOpen').onclick = () => { $('#homeCreate').hidden = true; $('#homeJoin').hidden = false; setHome(''); $('#codeIn').focus(); };
$('#btnJoinBack').onclick = () => { $('#homeJoin').hidden = true; $('#homeCreate').hidden = false; setHome(''); };
$('#btnRecLobby').onclick = openRecords;
$('#btnRecBack').onclick = () => { if (solo && S) applyState(S); else show('home'); };
$('#records').addEventListener('click', e => {
  const f = e.target.closest('[data-f]'), p = e.target.closest('[data-play]');
  if (f) { recF[f.dataset.f] = f.dataset.f === 'mode' ? f.dataset.v : +f.dataset.v; renderRecords(); }
  else if (p) startSolo(cfgOfKey(p.dataset.play), true);
  else if (e.target.closest('#recGo')) { if (solo && S) applyState(S); else startSolo(); }
});
for (const b of document.querySelectorAll('.snd')) b.onclick = () => {
  unlock(); SND.mute = !SND.mute;
  try { localStorage.setItem('jt_mute', SND.mute ? '1' : '0'); } catch (e) {}
  paintSnd(); play('join');
};
addEventListener('pointerdown', unlock, true);
addEventListener('keydown', unlock, true);
paintSnd();
$('#btnJoin').onclick = () => {
  const c = $('#codeIn').value.toUpperCase().replace(/[^A-Z]/g, '');
  if (c.length !== 4) { setHome('El código tiene 4 letras.', 'bad'); return; }
  if (getName()) { busy(); joinRoom(c); }
};
$('#btnJoinInvite').onclick = () => { if (getName()) { busy(); joinRoom(inviteCode); } };
$('#btnCopy').onclick = async () => {
  const b = $('#btnCopy');
  try { await navigator.clipboard.writeText(link()); b.textContent = 'Copiado'; } catch (e) { prompt('Copia el enlace:', link()); }
  setTimeout(() => b.textContent = 'Copiar enlace', 1500);
};
if (navigator.share) { $('#btnShare').hidden = false; $('#btnShare').onclick = () => navigator.share({ title: 'Bomba', url: link() }).catch(() => {}); }
$('#btnStart').onclick = startGame;
$('#btnLeave').onclick = leave;
$('#btnExit').onclick = leave;
$('#cfgBasic').addEventListener('click', cfgClick);
$('#cfgMoreBody').addEventListener('click', cfgClick);
$('#plist').addEventListener('click', e => { const b = e.target.closest('[data-kick]'); if (b && isHost) kick(b.dataset.kick); });
$('#word').addEventListener('input', e => {
  if (!S || S.turn !== myId) { e.target.value = ''; typed = ''; renderTyped(); return; }   // fuera de tu turno no se escribe
  typed = e.target.value; renderTyped(); act({ t: 'typing', text: typed });
});
$('#form').addEventListener('submit', e => { e.preventDefault(); const v = $('#word').value.trim(); if (v && S && S.turn === myId) act({ t: 'submit', w: v }); });
// un toque en cualquier sitio de la partida devuelve el foco al campo (y el teclado)
$('#word').addEventListener('focus', renderTyped);
$('#word').addEventListener('blur', renderTyped);
document.addEventListener('click', e => {
  const w = $('#word');
  if (!S || S.phase !== 'playing' || w.disabled || $('#game').hidden || !$('#over').hidden) return;
  if (e.target.closest('button, a, summary, details, input')) return;
  w.focus();
});
addEventListener('keydown', e => {
  if (S && S.phase === 'playing' && S.turn === myId && document.activeElement !== $('#word') && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) $('#word').focus();
});
addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey && S && S.solo && S.phase === 'ended' && !$('#over').hidden) { e.preventDefault(); $('#btnAgain').click(); }
});
addEventListener('pagehide', () => { if (net.clients.length) netPub(isHost ? 'all' : 'host', { t: isHost ? 'closed' : 'bye' }); });
$('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnJoin').click(); });
nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') (inviteCode.length === 4 ? $('#btnJoinInvite') : $('#btnCreate')).click(); });
})();
</script>
