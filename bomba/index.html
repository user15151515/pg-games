.who summary::after{content:"+";margin-left:auto;font-weight:800;font-size:22px;line-height:1}

.chip{background:var(--pink);border:var(--line);border-radius:10px;padding:1px 10px;font-weight:800;font-size:18px;flex:0 0 auto}

#over .big+.big{margin-top:12px}
#overHint{text-align:center;font-weight:600;margin:12px 0 0}
</style>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const MAX_LIVES = 5;
// letras del reto de la vida extra (20 en cada idioma; en inglés sin j, q, v, w, x, z)
const BONUS_BY = { es: 'abcdefghilmnopqrstuv', en: 'abcdefghiklmnoprstuy' };

// ---------- idioma ----------
// El idioma decide los textos y el diccionario. En una sala manda el del anfitrión (ajuste «lang»); fuera de una sala, el elegido con la bandera.
const LANGS = ['es', 'en'];
let pref = 'es';
try { const q = new URLSearchParams(location.search).get('lang'), st = localStorage.getItem('pg_bomba_lang'); pref = LANGS.includes(q) ? q : LANGS.includes(st) ? st : 'es'; } catch (e) {}
const lang = () => (S && S.settings && LANGS.includes(S.settings.lang)) ? S.settings.lang : pref;

function netSend(ch, m) {
  const t = Date.now();
  net.sent = net.sent.filter(x => t - x < 1000);
  if (net.sent.length >= MAX_RATE) return;   // válvula de seguridad: nunca más de MAX_RATE mensajes por segundo desde un cliente
  net.sent.push(t);
  try { const r = ch.send({ type: 'broadcast', event: 'm', payload: { f: myId, q: ++net.seq, m } }); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
function netPub(suffix, m) {
  if (!net.sb) return;
  let ch;
  const hbeat = m && (m.t === 'hb' || m.t === 'ping'), side = suffix === 'all' ? 'a' : 'u', t = Date.now();
  if (hbeat && t - net.last[side] < BEAT - 500) return;   // si ya se envió algo hace poco, el latido sobra
  net.last[side] = t;
  if (suffix === 'all') ch = net.a;
  else if (suffix === 'host') ch = m && m.t === 'hello' ? net.a : net.u[myId];
  else { const id = suffix.slice(3); ch = net.u[id]; if (m && m.t === 'kicked') setTimeout(() => netDrop(id), 800); }
  if (ch) netSend(ch, m);
}
function netChan(name, onEnv) {
  return new Promise((resolve, reject) => {
    const ch = net.sb.channel(TOPIC + room + ':' + name, { config: { broadcast: { self: false, ack: false } } });
    const to = setTimeout(() => reject(new Error('net')), 9000);
    ch.on('broadcast', { event: 'm' }, p => { const e = p && p.payload; if (e && typeof e === 'object' && e.m && typeof e.m === 'object') onEnv(e); });
    ch.subscribe(st => {
      if (st === 'SUBSCRIBED') { clearTimeout(to); resolve(ch); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { clearTimeout(to); reject(new Error('net')); }
    });
  });
}
// El anfitrión se suscribe al canal de cada invitado cuando llega su «hello» por el canal común.
async function netAttach(f, e) {
  if (!net.u[f]) {
    if (net.pend[f]) return;
    net.pend[f] = 1;
    try { net.u[f] = await netChan('u:' + f, x => { if (x.f === f) net.onMsg(x.m, f); }); }
    catch (x) { delete net.pend[f]; return; }
    delete net.pend[f];
  }
  net.onMsg(e.m, f);
}
function netDrop(id) {
  const ch = net.u[id]; if (!ch) return;
  delete net.u[id];
  try { net.sb.removeChannel(ch); } catch (e) {}
}
function netOpen(role) {
  netClose();
  net.role = role;
  return new Promise(async (resolve, reject) => {
    try {
      net.sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      net.clients = [net.sb];
      if (role === 'host') {
        for (let tries = 0; tries < 5; tries++) {
          if (net.a) { try { net.sb.removeChannel(net.a); } catch (e) {} net.a = null; }
          let taken = false;

        net.u[myId] = await netChan('u:' + myId, e => { if (e.f === 'host') net.onMsg(e.m, e.f); });

    } catch (e) { reject(new Error('net')); }

function netClose() {

const HOW_ES = `<summary>Cómo se juega</summary><div class="body">
<h3>La partida</h3>
<p>En cada turno aparece una sílaba de 2 o 3 letras. Quien tiene la bomba escribe una palabra en castellano que contenga esas letras seguidas, en cualquier posición: con <span class="ex">ent</span> valen <span class="ex">gente</span>, <span class="ex">entrada</span> o <span class="ex">cliente</span>.</p>
<p>Las mayúsculas y las tildes dan igual, y una palabra no se puede repetir durante la partida. Si vale, la bomba pasa al siguiente. Si explota en tu turno, pierdes una vida y el siguiente recibe la bomba con la misma sílaba, salvo que ya la haya intentado: entonces sale otra; sin vidas quedas eliminado y gana quien se queda en pie. Con el ajuste «Más difícil con cada eliminado» (activado por defecto), cada jugador que cae hace que las sílabas sean un poco más difíciles, para que el final no se alargue.</p>
<p>Cada palabra que aciertas marca las letras que usa. Si completas estas 20 letras a lo largo de la partida ganas una vida (máximo 5) y vuelves a empezar: <b>${[...BONUS_BY.es].join(' ').toUpperCase()}</b>.</p>
<p>El diccionario tiene unas 636.000 formas, con plurales y conjugaciones, aunque puede que alguna palabra falte.</p>
<h3>Individual</h3>
<p>Hay dos modos. <b>Mecha por palabra</b>: juegas solo contra la mecha, que se reinicia en cada palabra. Se cuentan los aciertos y la racha, que son las palabras seguidas sin que explote la bomba. La partida acaba al quedarte sin vidas. <b>Contrarreloj</b>: tienes un tiempo total (15 s, 30 s, 1 o 2 minutos) y la mecha no se reinicia; escribe todas las palabras que puedas antes de que explote. Aquí no hay vidas y el récord es el total de palabras. El récord se guarda en este navegador, por separado para cada combinación de ajustes (dificultad, vidas, tiempo y longitudes de sílaba y de palabra) y para cada idioma. En «Ver récords» salen todos, se pueden filtrar y desde ahí puedes jugar con la misma configuración.</p>
<h3>Dificultad</h3>
<p>Las sílabas se sacan del propio diccionario y se agrupan por lo comunes que son, según en cuántas palabras aparecen. Una sílaba no se repite hasta que han salido otras 8.</p>
<dl>
<dt>Fácil</dt><dd>Solo sílabas comunes, las que aparecen en 3.000 palabras o más: <span class="ex">ar</span> <span class="ex">con</span> <span class="ex">ent</span> <span class="ex">cia</span> <span class="ex">tr</span>.</dd>
<dt>Normal</dt><dd>70 % comunes y 30 % intermedias, de entre 800 y 3.000 palabras: <span class="ex">gui</span> <span class="ex">ues</span> <span class="ex">jam</span>.</dd>
<dt>Difícil</dt><dd>20 % comunes, 50 % intermedias y 30 % raras, de entre 150 y 800 palabras: <span class="ex">abs</span> <span class="ex">ugr</span> <span class="ex">vot</span>.</dd>
</dl>
<h3>Ajustes</h3>
<dl>
<dt>Letras de la sílaba</dt><dd>Mixto mezcla sílabas de 2 y 3 letras. Si eliges solo 2, salen sílabas más cortas y en general más fáciles; solo 3, más variedad.</dd>
<dt>Letras mínimas de la palabra</dt><dd>Las palabras más cortas no valen.</dd>
<dt>Mecha compartida</dt><dd>La bomba tiene una mecha de duración aleatoria entre el tiempo mínimo y el máximo, y no se reinicia al pasarla: quien la recibe hereda lo que quede. Al explotar se enciende otra nueva.</dd>
<dt>Mecha por turno</dt><dd>Cada jugador recibe una mecha nueva, aleatoria entre el mínimo y el máximo. Si pones los dos iguales, todos tienen el mismo tiempo.</dd>
<dt>Segundos extra al acertar</dt><dd>Con mecha compartida, suma esos segundos a lo que quede al pasar la bomba.</dd>
<dt>Mínimo al recibir la bomba</dt><dd>Con mecha compartida, a quien recibe la bomba le quedan siempre al menos esos segundos (mínimo 4), aunque la mecha estuviera casi agotada.</dd>
<dt>Orden de pase</dt><dd><b>Círculo</b>: la bomba sigue el orden de la sala y vuelve al primero. <b>Rebote</b>: va hasta el último jugador y rebota hacia atrás, y así de ida y vuelta. <b>Azar</b>: pasa a cualquier otro jugador que siga en juego.</dd>
<dt>Tras explotar</dt><dd>La bomba pasa al siguiente según el orden de pase, o se queda con quien ha perdido la vida si sigue en juego. En ambos casos se enciende una mecha nueva.</dd>
<dt>Vida extra con las 20 letras</dt><dd>Activa o desactiva el reto de las letras.</dd>
<dt>Ver la mecha</dt><dd>Muestra una barra con el tiempo que queda. Sin ella solo ves cómo tiembla la bomba.</dd>
</dl>
<p>La bandera de arriba cambia el idioma y el diccionario. En una sala, solo el anfitrión cambia el idioma y los ajustes y puede echar a jugadores; el resto los ve.</p>
</div>`;
const HOW_EN = `<summary>How to play</summary><div class="body">

<p>There are two modes. <b>Fuse per word</b>: you play alone against the fuse, which resets on every word. Your score is your words and your streak, the words in a row without the bomb going off. The game ends when you run out of lives. <b>Time attack</b>: you get a total time (15 s, 30 s, 1 or 2 minutes) and the fuse doesn't reset; play as many words as you can before it blows. There are no lives here and the record is your total words. Records are saved in this browser, separately for each combination of settings (difficulty, lives, time, syllable and word length) and for each language. “See all records” lists them all, lets you filter them and play again with the same settings.</p>
<h3>Difficulty</h3>
<p>Syllables come from the dictionary itself and are grouped by how common they are, based on how many words contain them. A syllable doesn't come back until 8 others have appeared.</p>
<dl>

<dt>Hard</dt><dd>20 % common, 50 % medium and 30 % rare, found in 150 to 450 words: <span class="ex">abs</span> <span class="ex">oxy</span> <span class="ex">awn</span>.</dd>

<h3>Settings</h3>
<dl>

    typed = ''; w.value = '';
    if (canType && document.activeElement !== w) { w.focus(); setTimeout(() => { if (S && S.phase === 'playing') w.focus(); }, 30); }
    if (myTurn && !s.solo) play('turn');
    lastTurn = s.turn;
  }
  renderTyped();
  const L = me ? me.letters : '';
  $('#letters').innerHTML = s.settings.letters && !(s.solo && isRush(s.settings)) && me && me.alive && s.phase === 'playing' ? [...(BONUS_BY[s.settings.lang] || BONUS_BY.es)].map(c => `<span class="${L.includes(c) ? 'on' : ''}">${c}</span>`).join('') : '';
  const over = $('#over');
  if (s.phase === 'ended') { over.hidden = false; renderResults(s); }
  else over.hidden = true;
}

let msgTm = 0;
function say(text, cls) { const m = $('#msg'); m.textContent = text; m.className = cls || ''; clearTimeout(msgTm); msgTm = setTimeout(() => { m.textContent = ''; m.className = ''; }, 3200); }
function showEvent(e) {
  if (e.k === 'ok') {
    play(e.bonus ? 'bonus' : 'ok');
    say(e.name + ': ' + e.w + (e.bonus ? tx('plusLife') : ''), 'ok');
    if (e.id === myId) { $('#word').value = ''; typed = ''; }
  } else if (e.k === 'boom') {
    play('boom');
    say(e.out ? tx('out', e.name) : tx('loses', e.name), 'bad');
    const f = $('#flash'), b = $('#bomb');
    f.classList.remove('go'); b.classList.remove('boom'); void f.offsetWidth; f.classList.add('go'); b.classList.add('boom');
    setTimeout(() => { const el = document.querySelector('.pl[data-id="' + CSS.escape(String(e.id)) + '"]'); if (el) el.classList.add('hit'); }, 30);
  } else if (e.k === 'join') { play('join'); say(tx('joins', e.name)); }
  else if (e.k === 'left') { play('left'); say(tx(e.kicked ? 'kicked' : 'left', e.name)); }
}
function badInput(m) {
  play('bad'); say(m, 'bad'); const st = $('#stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); $('#word').select();
}

// la bomba salta de ficha en ficha y tiembla más cuanto menos mecha queda
let bx = null, by = 0, nextTick = 0;
(function loop() {
  requestAnimationFrame(loop);
  const b = $('#bomb'); if (!b) return;
  if (!S || S.phase !== 'playing') { b.style.opacity = 0; bx = null; return; }
  const t = document.querySelector('.pl.turn .tok');
  if (!t) { b.style.opacity = 0; return; }
  const r = t.getBoundingClientRect(), st = $('#strip').getBoundingClientRect();
  const tx = r.left - st.left + r.width / 2 - b.offsetWidth / 2, ty = r.top - st.top - b.offsetHeight + 2;
  if (bx === null) { bx = tx; by = ty; }
  bx += (tx - bx) * 0.2; by += (ty - by) * 0.2;
  const dist = Math.hypot(tx - bx, ty - by), hop = Math.min(dist, 140) * 0.35;
  const rem = Math.max(0, (fuseEnd - now()) / 1000), T = Math.min(8, fuseTotal / 1000 * 0.7);
  const amp = rem < T ? (T - rem) / T * 5 : 0;
  b.style.opacity = 1;
  b.style.transform = `translate(${bx + (Math.random() - .5) * amp}px,${by - hop + (Math.random() - .5) * amp}px)`;
  if (rem > 0 && now() >= nextTick) { play('tick', S.turn === myId); nextTick = now() + (rem > 6 ? 1000 : rem > 3 ? 500 : rem > 1.5 ? 250 : 125); }
  const fz = $('#fuse');
  if (!fz.hidden) fz.firstElementChild.style.width = Math.max(0, Math.min(100, rem * 1000 / fuseTotal * 100)) + '%';
})();

// ---------- eventos de la interfaz ----------
document.addEventListener('click', e => { const b = e.target.closest('.flag[data-lang]'); if (b && !b.disabled) { unlock(); setLang(b.dataset.lang); } });
paintStatic();
const nameIn = $('#name');
nameIn.value = localStorage.getItem('jt_name') || '';
const params = new URLSearchParams(location.search);
const inviteCode = (params.get('sala') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
if (inviteCode.length === 4) { $('#homeCreate').hidden = true; $('#homeInvite').hidden = false; $('#inviteCode').textContent = inviteCode; }
$('#gameSw').addEventListener('click', e => { const b = e.target.closest('button[data-g]'); if (b) switchGame(b.dataset.g); });
if (params.get('e') === 'k') setHome(tx('youKicked'), 'bad');

function getName() {
  const n = nameIn.value.trim();
  if (!n) { setHome(tx('typeName'), 'bad'); nameIn.focus(); return null; }
  localStorage.setItem('jt_name', n); myName = n; setHome(''); return n;
}
function busy() { for (const b of ['#btnCreate', '#btnSolo', '#btnJoin', '#btnJoinInvite']) $(b).disabled = true; setHome(tx('connecting')); }
$('#btnCreate').onclick = () => { if (getName()) { busy(); createRoom(); } };
$('#btnSolo').onclick = () => startSolo();
$('#btnJoinOpen').onclick = () => { $('#homeCreate').hidden = true; $('#homeJoin').hidden = false; setHome(''); $('#codeIn').focus(); };
$('#btnJoinBack').onclick = () => { $('#homeJoin').hidden = true; $('#homeCreate').hidden = false; setHome(''); };
$('#btnRecLobby').onclick = openRecords;
$('#btnRecBack').onclick = () => { if (solo && S) applyState(S); else show('home'); };
$('#records').addEventListener('click', e => {
  const f = e.target.closest('[data-f]'), p = e.target.closest('[data-play]');
  if (f) { recF[f.dataset.f] = f.dataset.f === 'mode' ? f.dataset.v : +f.dataset.v; renderRecords(); }
  else if (p) startSolo(cfgOfKey(p.dataset.play), true);
  else if (e.target.closest('#recGo')) { if (solo && S) applyState(S); else startSolo(); }
});
for (const b of document.querySelectorAll('.snd')) b.onclick = () => {
  unlock(); SND.mute = !SND.mute;
  try { localStorage.setItem('jt_mute', SND.mute ? '1' : '0'); } catch (e) {}
  paintSnd(); play('join');
};
addEventListener('pointerdown', unlock, true);
addEventListener('keydown', unlock, true);
paintSnd();
$('#btnJoin').onclick = () => {
  const c = $('#codeIn').value.toUpperCase().replace(/[^A-Z]/g, '');
  if (c.length !== 4) { setHome(tx('code4'), 'bad'); return; }
  if (getName()) { busy(); joinRoom(c); }
};
$('#btnJoinInvite').onclick = () => { if (getName()) { busy(); joinRoom(inviteCode); } };
$('#btnCopy').onclick = async () => {
  const b = $('#btnCopy');
  try { await navigator.clipboard.writeText(link()); b.textContent = tx('copied'); } catch (e) { prompt(tx('copyPrompt'), link()); }
  setTimeout(() => b.textContent = tx('copy'), 1500);
};
if (navigator.share) { $('#btnShare').hidden = false; $('#btnShare').onclick = () => navigator.share({ title: tx('title'), url: link() }).catch(() => {}); }
$('#btnStart').onclick = startGame;
$('#btnLeave').onclick = leave;
$('#btnExit').onclick = leave;
$('#cfgBasic').addEventListener('click', cfgClick);
$('#cfgMoreBody').addEventListener('click', cfgClick);
$('#plist').addEventListener('click', e => { const b = e.target.closest('[data-kick]'); if (b && isHost) kick(b.dataset.kick); });
$('#word').addEventListener('input', e => {
  if (!S || S.turn !== myId) { e.target.value = ''; typed = ''; renderTyped(); return; }   // fuera de tu turno no se escribe
  typed = e.target.value; renderTyped(); sendTyping();
});
let typAt = 0, typTm = 0;
function sendTyping() {   // como mucho cuatro avisos por segundo: el resto de jugadores solo ve el texto en vivo
  const t = now();
  clearTimeout(typTm);
  if (t - typAt >= 250) { typAt = t; act({ t: 'typing', text: typed }); }
  else typTm = setTimeout(() => { typAt = now(); act({ t: 'typing', text: typed }); }, 260);
}
$('#form').addEventListener('submit', e => { e.preventDefault(); const v = $('#word').value.trim(); if (v && S && S.turn === myId) act({ t: 'submit', w: v }); });
// un toque en cualquier sitio de la partida devuelve el foco al campo (y el teclado)
$('#word').addEventListener('focus', renderTyped);
$('#word').addEventListener('blur', renderTyped);
document.addEventListener('click', e => {
  const w = $('#word');
  if (!S || S.phase !== 'playing' || w.disabled || $('#game').hidden || !$('#over').hidden) return;
  if (e.target.closest('button, a, summary, details, input')) return;
  w.focus();
});
addEventListener('keydown', e => {
  if (S && S.phase === 'playing' && S.turn === myId && document.activeElement !== $('#word') && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) $('#word').focus();
});
addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey && S && S.solo && S.phase === 'ended' && !$('#over').hidden) { e.preventDefault(); $('#btnAgain').click(); }
});
{
  const hostCode = (params.get('host') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  if (hostCode.length === 4 && nameIn.value.trim()) { getName(); busy(); createRoom(hostCode); }
  else if (inviteCode.length === 4 && params.get('go') === '1' && nameIn.value.trim()) { getName(); busy(); autoJoin = true; joinRoom(inviteCode); }
}
addEventListener('pagehide', () => { if (net.clients.length && !switching) netPub(isHost ? 'all' : 'host', { t: isHost ? 'closed' : 'bye' }); });
$('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnJoin').click(); });
nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') (inviteCode.length === 4 ? $('#btnJoinInvite') : $('#btnCreate')).click(); });
})();
