<style>
.back{display:inline-block;font-weight:700;text-decoration:none;margin-bottom:18px}
.back:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:3px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:28px}
.hero h1{font-size:clamp(84px,28vw,150px)}
.stack{display:grid;gap:14px}
.row{display:flex;gap:12px}
.row input{flex:1;min-width:0}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.topline .back{margin:0}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.cta button{font-size:clamp(28px,9vw,38px);font-weight:800;font-stretch:75%;letter-spacing:-.01em;line-height:1;padding:30px 8px;border-radius:20px}
.cta .primary{box-shadow:5px 5px 0 var(--pink)}
.cta .primary:hover:not(:disabled){box-shadow:7px 7px 0 var(--pink)}
.subrow{display:flex;justify-content:center;margin-top:6px}
#codeIn{text-transform:uppercase;letter-spacing:.25em;font-weight:800;text-align:center;font-size:44px;font-stretch:75%;padding:14px 10px}
.bar .snd,.topline .snd{margin-left:auto}
.snd[aria-pressed=false]{text-decoration-line:line-through}
#homeMsg{min-height:30px;margin:14px 0 0;font-weight:600}
#homeMsg.bad{width:fit-content;background:var(--pink);padding:2px 12px;border-radius:99px}

/* barra superior (sala y partida) */
.bar{display:flex;align-items:center;gap:20px;margin-bottom:12px;font-weight:700;font-size:16px}
.bar a,.linkbtn{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:3px}
.linkbtn{background:none;border:0;box-shadow:none;padding:2px 0;font:inherit;font-weight:700;cursor:pointer}
.linkbtn:hover:not(:disabled),.linkbtn:active:not(:disabled){transform:none;box-shadow:none;text-decoration-color:var(--pink)}

/* fichas de jugador */
.tok{width:50px;height:50px;border-radius:50%;border:var(--line);background:var(--bg);color:var(--fg);display:grid;place-items:center;
  font-weight:800;font-size:22px;flex:0 0 auto;transition:transform .2s,box-shadow .2s}
.tok.sm{width:38px;height:38px;font-size:17px}
.tok.xs{width:28px;height:28px;font-size:13px;border-width:2px}

/* paneles desplegables */
details.panel{background:var(--white);border:var(--line);border-radius:16px;padding:0 16px;margin-top:14px}
details.panel summary{cursor:pointer;font-weight:700;padding:13px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;border-radius:10px}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+";font-weight:800;font-size:24px;line-height:1}
details.panel[open] summary::after{content:"−"}
details.panel summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.body{padding:0 0 16px;font-size:16px;line-height:1.45}
.body h3{font-size:17px;margin:18px 0 6px;font-weight:800}
.body h3:first-child{margin-top:2px}
.body p{margin:0 0 8px}
.ex{font-weight:700;background:var(--paper);border-radius:6px;padding:0 5px;white-space:nowrap}

/* sala */
.codecard{background:var(--white);border:var(--line);border-radius:20px;box-shadow:var(--hard);padding:18px 20px 20px;transform:rotate(-1.2deg);margin-bottom:22px}
.codecard .display{font-size:clamp(76px,26vw,120px);letter-spacing:.06em;margin-bottom:14px}
.codecard .row button{flex:1;padding:12px 10px}
.set{display:grid;gap:6px;margin-bottom:16px}
.set .lbl{font-size:15px;font-weight:700}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 6px;box-shadow:none;background:transparent;color:var(--ink);font-size:16px;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:hover:not(:disabled),.seg button:active:not(:disabled){transform:none;box-shadow:none}
.seg button:disabled{opacity:1;cursor:default}
.seg button:disabled:not(.on){opacity:.4}
#gameSw{margin:18px 0 4px}
#gameSw .lbl{display:block;font-weight:800;font-size:14px;margin:0 0 6px}
#lobbyHint{text-align:center;font-weight:600;margin:14px 0 0;min-height:24px}
#cfgSum{font-weight:600;margin:0 0 18px;opacity:.75}
#recLine{margin:0 0 14px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 10px}
.team{background:var(--white);border:var(--line);border-radius:18px;padding:10px 12px 12px;box-shadow:var(--hard);min-width:0}
.team.mine{box-shadow:5px 5px 0 var(--tc)}
.team.empty{border-style:dashed;box-shadow:none;background:transparent}
.team h3{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;font-stretch:75%;line-height:1}
.team .ord{font-size:15px;font-weight:800;font-stretch:100%;border:2px solid var(--ink);border-radius:99px;padding:1px 7px;line-height:1.2}
.team .mv{display:flex;gap:6px;margin-top:8px}
.team .mv button{flex:1;padding:4px 2px;font-size:13px;border-width:2px;border-radius:10px;box-shadow:none;background:transparent;color:var(--ink);white-space:nowrap}
.team .mv button:hover:not(:disabled),.team .mv button:active:not(:disabled){transform:none;box-shadow:none;background:var(--tc)}
.team .mv button:disabled{opacity:.25}
.dot{width:16px;height:16px;border-radius:50%;background:var(--tc);border:2px solid var(--ink);flex:0 0 auto;display:inline-block}
.mem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-top:8px}
.mem .nm{display:grid;min-width:0;line-height:1.15}
.mem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem small{font-size:12px;font-weight:600;opacity:.7;overflow-wrap:anywhere}
.mem.wait{opacity:.45}
.mem .kick{padding:2px 8px;font-size:13px;box-shadow:none;background:transparent;color:var(--ink);border-width:2px;border-radius:10px}
.mem .kick:hover:not(:disabled),.mem .kick:active:not(:disabled){transform:none;box-shadow:none;background:var(--pink)}
.team .here{margin-top:10px;width:100%;padding:6px 8px;font-size:15px;box-shadow:none;background:transparent;color:var(--ink);border-width:2px}
.team .here:hover:not(:disabled),.team .here:active:not(:disabled){transform:none;box-shadow:none;background:var(--tc)}
.team .none{font-size:14px;font-weight:600;opacity:.6;margin-top:8px}
#myRole{margin:8px 0 16px}
.rnote{font-size:14px;font-weight:600;opacity:.7}
#teamTools{display:flex;justify-content:center;margin:0 0 18px;min-height:8px}

/* partida */
#game .top{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
#board{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 12px}
.tb{display:flex;align-items:center;gap:7px;border:var(--line);border-radius:99px;padding:3px 13px 3px 5px;background:var(--white);font-weight:700;font-size:15px;transition:transform .2s}
.tb b{font-size:22px;font-weight:800;font-stretch:75%;line-height:1}
.tb small{font-size:13px;font-weight:700;opacity:.7}
.tb.on{box-shadow:var(--hard);transform:rotate(-2deg) scale(1.06)}
#prepCard{background:var(--white);border:var(--line);border-radius:26px;box-shadow:6px 6px 0 var(--tc);padding:18px 18px 22px;text-align:center;transform:rotate(-.8deg);margin-top:6px}
#prepCard .k{font-weight:700;font-size:16px}
#prepTeam{font-size:clamp(64px,20vw,108px);margin:2px 0 12px}
#prepRoles{display:grid;gap:8px;margin:0 0 18px;justify-items:center}
.role{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.role small{font-size:14px;font-weight:600;opacity:.7}
#prepMe{font-weight:800;font-size:22px;margin:0 0 14px}
#btnSwap{margin:-6px 0 16px;padding:6px 16px;font-size:15px;box-shadow:none;background:transparent;color:var(--ink);border-width:2px;border-radius:99px}
#btnSwap:hover:not(:disabled),#btnSwap:active:not(:disabled){transform:none;box-shadow:none;background:var(--tc)}
#prepClock{font-weight:600;font-size:15px;margin:12px 0 0;min-height:21px}
#lastT{margin-top:22px;text-align:center}
#lastT h4{margin:0 0 8px;font-size:16px;font-weight:700}
.wl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wl span{border:2px solid var(--ink);border-radius:10px;padding:0 8px;font-weight:700;font-size:15px;background:var(--white);white-space:nowrap}
.wl span em{font-style:normal;font-weight:800;margin-left:5px}
.wl .ok{background:var(--mint)}
.wl .z{opacity:.5;text-decoration:line-through}
#roles{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:15px;margin:0 0 8px}
#roles .tn{display:inline-flex;align-items:center;gap:5px;font-weight:800}
#roles .tn .dot{width:13px;height:13px}
#roles .me{background:var(--ink);color:var(--paper);border-radius:99px;padding:1px 10px}
#rosco{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:0 0 6px}
#rosco span{width:27px;height:29px;border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:800;border:2px solid var(--ink);background:var(--white);transition:transform .2s}
#rosco .ok{background:var(--mint)}
#rosco .x{opacity:.35;text-decoration:line-through}
#rosco .ps{border-style:dashed;background:transparent}
#rosco .cur{background:var(--ink);color:var(--paper);transform:scale(1.2)}
#stage{container-type:inline-size;background:var(--white);border:var(--line);border-radius:26px;box-shadow:var(--hard);
  padding:10px 14px 16px;margin-top:10px;text-align:center;transform:rotate(-.6deg);cursor:text}
#stage.shake{animation:sshake .4s}
@keyframes sshake{20%{transform:rotate(-.6deg) translateX(-9px)}40%{transform:rotate(-.6deg) translateX(9px)}60%{transform:rotate(-.6deg) translateX(-5px)}80%{transform:rotate(-.6deg) translateX(5px)}}
#stage.win{animation:swin .45s}
@keyframes swin{40%{transform:rotate(1.5deg) scale(1.03);background:var(--mint)}}
#lmode{font-weight:700;font-size:15px;min-height:20px}
#letter{font-weight:800;font-stretch:75%;font-size:min(34cqw,140px);line-height:.95}
#letter.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7) rotate(-4deg)}to{transform:none}}
#secret{display:inline-block;background:var(--ink);color:var(--paper);border-radius:12px;padding:2px 14px;font-weight:800;font-size:26px;margin:4px 0 2px;text-transform:uppercase;letter-spacing:.02em}
#clues{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px 0 6px;min-height:46px}
.clue{background:var(--paper);border:var(--line);border-radius:12px;padding:3px 12px;font-weight:800;font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.clue.new{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.clue .dot{width:12px;height:12px;margin-right:6px;vertical-align:1px}
.clue i{font-style:normal;font-size:12px;font-weight:700;opacity:.55;margin-right:6px;vertical-align:2px}
.cwait{font-weight:600;opacity:.6}
#entry{position:relative;margin-top:10px;min-height:1.4em}
#tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;font-size:min(44px,calc(88cqw / (var(--n,7) * 1.2)));min-height:1.35em}
.t{width:1.05em;height:1.3em;display:grid;place-items:center;border:3px solid var(--ink);border-radius:.2em;background:var(--white);
  font-weight:800;text-transform:uppercase;line-height:1}
.t.sp{border-color:transparent;width:.45em}
#tiles .hint{font-size:17px;font-weight:600;opacity:.6;align-self:center}
.caret{width:.1em;height:1.3em;background:var(--ink);align-self:center;margin:0 2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#word{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:none;box-shadow:none;font-size:16px;padding:0;cursor:text}
#word:disabled{pointer-events:none}
#tries{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;margin-top:10px;min-height:22px;font-weight:700;font-size:15px}
#tries span{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
#fuse{height:14px;border:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
#fuse i{display:block;height:100%;width:100%;background:var(--pink)}
#clock{font-weight:700;font-size:16px;min-height:24px;margin-top:6px}
#send{margin-top:12px}
#cform{display:flex;gap:10px;margin-top:16px}
#cform input{flex:1;min-width:0;font-size:20px}
#cform button{padding:13px 18px}
#cform input:disabled{opacity:.6}
.role.tline{gap:8px;font-size:17px;flex-wrap:wrap;justify-content:center}
.role.tline b{font-weight:800}
#lastT h4 .dot{width:13px;height:13px;vertical-align:-1px}
#cfgSet .rnote{display:block;margin-top:2px}
#btnPass{margin-top:12px;background:var(--pink);color:var(--ink)}
#msg{display:block;width:fit-content;min-height:30px;margin:14px auto 0;padding:2px 14px;border-radius:99px;font-weight:700;font-size:17px}
#msg.ok{background:var(--mint)}
#msg.bad{background:var(--pink)}

/* resultados */
#over{position:fixed;inset:0;background:#17140f99;display:grid;place-items:center;z-index:10;padding:16px}
#over .box{background:var(--white);border:var(--line);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:24px 22px;max-width:420px;width:100%;
  max-height:92dvh;overflow:auto;transform:rotate(-.8deg)}
#over .display{font-size:clamp(46px,14vw,70px);margin-bottom:18px;word-break:break-word}
#rank{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:12px}
.who summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;border-radius:10px}
.who summary::-webkit-details-marker{display:none}
.who summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.who summary::after{content:"+";margin-left:auto;font-weight:800;font-size:22px;line-height:1}
.who[open] summary::after{content:"−"}
.who .n{width:16px;font-weight:800;font-size:18px;text-align:center}
.who b{display:block;font-size:19px;line-height:1.1}
.who small{display:block;font-size:15px;font-weight:500;line-height:1.2}
.tl{margin:12px 0 4px 28px}
.tl p{margin:0 0 6px;font-size:15px;font-weight:600}
.tl .wl{justify-content:flex-start}
#over .big+.big{margin-top:12px}
#overHint{text-align:center;font-weight:600;margin:12px 0 0}
</style>
<script>window.PGT={ev(){},start(){},end(){},game(){},vid:''}</script>
<script src="../pg.js" defer></script>

<body>
<noscript><p style="padding:20px;font:700 20px system-ui">Los juegos necesitan JavaScript. Actívalo en tu navegador y recarga la página.</p></noscript>
<main class="wrap">

<div class="bar" id="bar" hidden>
  <button type="button" class="linkbtn" id="btnLeave">← Salir</button>
  <a href="../">pg games</a>
  <button type="button" class="linkbtn snd" aria-pressed="true">Sonido</button>
</div>

<section id="home">
  <div class="topline"><a class="back" href="../">pg games</a><button type="button" class="linkbtn snd" aria-pressed="true">Sonido</button></div>
  <div class="hero">
    <h1 class="display">Pistas</h1>
  </div>
  <div class="stack">
    <input id="name" type="text" maxlength="14" autocomplete="off" aria-label="Tu nombre" placeholder="Tu nombre">
    <div id="homeCreate">
      <div class="cta">
        <button id="btnCreate" class="primary">Crear sala</button>
        <button id="btnJoinOpen" class="alt">Unirse</button>
      </div>
    </div>
    <div id="homeJoin" class="stack" hidden>
      <input id="codeIn" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Código de sala" placeholder="ABCD">

      <div class="subrow"><button id="btnJoinBack" type="button" class="linkbtn">← Volver</button></div>
    </div>
    <div id="homeInvite" hidden>
      <button id="btnJoinInvite" class="big">Entrar a <span id="inviteCode"></span></button>
    </div>
  </div>
  <p id="homeMsg" role="status"></p>
  <details class="panel" id="howHome"></details>
</section>

<section id="lobby" hidden>
  <div class="codecard" id="codecard">
    <div class="display" id="lobbyCode">----</div>
    <div class="row">
      <button id="btnCopy">Copiar enlace</button>
      <button id="btnShare" class="alt" hidden>Compartir</button>
    </div>
  </div>
  <div id="gameSw" hidden></div>
  <div class="teams" id="teams"></div>
  <div class="set" id="myRole" hidden></div>
  <div id="teamTools"><button type="button" class="linkbtn" id="btnMix" hidden>Mezclar parejas</button></div>
  <p id="cfgSum"></p>
  <div id="recLine" hidden></div>
  <button id="btnStart" class="big" hidden>Empezar</button>
  <p id="lobbyHint" role="status"></p>
  <details class="panel" id="cfgMore"><summary>Ajustes</summary><div class="body"><div id="cfgSet"></div></div></details>
  <details class="panel" id="howLobby"></details>
</section>

<section id="game" hidden>
  <div class="top"><span id="gCode"></span><span id="gInfo"></span></div>
  <div id="board"></div>
  <div id="prep" hidden>
    <div id="prepCard">
      <div class="k">Turno de</div>
      <div class="display" id="prepTeam"></div>
      <div id="prepRoles"></div>
      <p id="prepMe"></p>
      <button id="btnSwap" type="button" hidden>Cambiar papeles</button>
      <button id="btnGo" class="big" type="button" hidden>Empezar</button>
      <p id="prepClock"></p>
    </div>
    <div id="lastT"></div>
  </div>
  <div id="play" hidden>
    <div id="roles"></div>
    <div id="rosco"></div>
    <div id="stage">
      <div id="lmode"></div>
      <div id="letter"></div>
      <div id="secret" hidden></div>
      <div id="clues" aria-live="polite"></div>
      <form id="gform" autocomplete="off">
        <div id="entry">
          <div id="tiles" aria-live="off"></div>
          <input id="word" type="text" maxlength="30" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Tu respuesta" disabled>
        </div>
        <button id="send" class="big" type="submit" hidden>Probar</button>
      </form>
      <div id="tries"></div>
      <div id="fuse"><i></i></div>
      <div id="clock"></div>
    </div>
    <form id="cform" autocomplete="off" hidden>
      <input id="clueIn" type="text" maxlength="30" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Tu pista" placeholder="Una o dos palabras">
      <button type="submit">Pista</button>
    </form>
    <button id="btnPass" class="big" type="button" hidden>Pasapalabra</button>
  </div>
  <span id="msg" role="status"></span>
</section>

<div id="over" hidden>
  <div class="box">
    <div class="display" id="overTitle"></div>
    <ol id="rank"></ol>
    <button id="btnAgain" class="big">Jugar de nuevo</button>
    <button id="btnExit" class="big alt">Salir</button>
    <p id="overHint"></p>
  </div>
</div>

</main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const COLORS = [['#ff5c8a','#17140f'],['#3b5bff','#fffef8'],['#2fd08a','#17140f'],['#ff8a3d','#17140f'],
                ['#8b5cf6','#fffef8'],['#17140f','#ffd93d'],['#fffef8','#17140f'],['#22c3e6','#17140f']];

// ---------- red ----------
// Supabase Realtime, solo broadcast: no hay tablas ni base de datos y las salas existen mientras haya alguien conectado.
// Canal «a» (todos): lo que emite el anfitrión. Canal «u:<id>» (uno por invitado): lo que se dicen ese invitado y el anfitrión.
// Así cada mensaje de un invitado lo recibe solo el anfitrión, no el resto de jugadores.

const HOW = `<summary>Cómo se juega</summary><div class="body">
<h3>Equipos</h3>

<h3>El turno</h3>
<p>En cada turno, uno del equipo da las pistas y el resto adivina. Sale una lista de letras y para cada una hay una palabra secreta que solo ve quien da las pistas (y los otros equipos, que miran). Con la C podría ser <span class="ex">cohete</span>; con la Ñ y la X la palabra contiene la letra, no empieza por ella.</p>

<p>Al acertar se pasa sola a la siguiente letra. Con «Pasapalabra» la letra se salta y vuelve al final, con las pistas que ya llevaba.</p>

<p>Cada palabra vale 10 puntos si la sacáis con una pista y uno menos por cada pista más, como mínimo 3. Si completáis todas las letras antes de que acabe el tiempo, cada segundo que sobra es un punto más.</p>

<h3>Rondas</h3>
<p>En cada ronda juega una vez cada equipo. Cada uno puede elegir en la sala si prefiere dar pistas, adivinar o turnarse; si no, quien da las pistas va rotando. Las palabras no se repiten en la misma sala y, en lo posible, tampoco a quien ya las ha visto en otras partidas. El anfitrión elige en Ajustes cuántas letras, cuánto tiempo, cuántas rondas y la dificultad de las palabras.</p>

}
function switchGame(g) {

  switching = true; bcast({ t: 'goto', g });
  setTimeout(() => { location.href = '../' + g + '/?host=' + room; }, 450);
}

function leave() {
  if (isHost && H && H.players.some(p => p.on && p.id !== 'host') && !confirm('Si sales, la sala se cierra para todos. ¿Salir?')) return;
  if (net.clients.length) netPub(isHost ? 'all' : 'host', { t: isHost ? 'closed' : 'bye' });
  setTimeout(goHome, 150);
}
function onMsg(m) {
  if (!m) return;
  if (m.t === 'goto' && !isHost && room && GAMES_SW.some(x => x[0] === m.g) && m.g !== THIS_GAME) { switching = true; location.href = '../' + m.g + '/?sala=' + room + '&go=1'; return; }
  if (!isHost) lastHeard = now();
  if (m.t === 'state') {
    if (m.s.v <= lastV) return;
    lastV = m.s.v; if (!gotState) PGT.ev('room_join'); gotState = true; applyState(m.s);
  } else if (m.t === 'evt') showEvent(m.e);
  else if (m.t === 'word') { myWords[String(m.k)] = String(m.w || ''); if (S && S.phase === 'play') renderGame(); }
  else if (m.t === 'typ') { live[String(m.k)] = String(m.text || ''); if (S && S.phase === 'play') renderTiles(); }
  else if (m.t === 'nope') { if (m.why) { $('#clueIn').value = lastClue; play('bad'); say(m.why, 'bad'); } }
  else if (m.t === 'full') fail('La sala está llena.');
  else if (m.t === 'started') fail('La partida ya ha empezado.');
  else if (m.t === 'kicked') { netClose(); location.href = location.pathname + '?e=k'; }

}

  if (s.res && s.res.hist) for (const h of s.res.hist) markSeen(h.L.map(x => x.w));

function renderBoard(s, c) {
  if (s.teams.length < 2) { $('#board').innerHTML = ''; return; }
  const lv = {};   // durante el turno: puntos que se van sumando y, a la vez, cuántas lleva cada equipo
  if (c && s.phase === 'play') {
    if (c.pw) c.pw.ts.forEach((z, i) => { lv[z.t] = { on: i === c.pw.who, add: z.pts }; });
    else for (const u of c.runs) lv[u.t] = { on: c.runs.length === 1, add: u.pts + u.bonus, prog: c.runs.length > 1 ? `${u.L.filter(x => x.st === 'ok').length}/${u.L.length}` : '' };
  } else if (c && c.m === 't') for (const z of parts(c)) lv[z.t] = { on: true };
  $('#board').innerHTML = s.teams.map((t, i) => { const v = lv[i] || {};
    return `<div class="tb ${v.on ? 'on' : ''}" style="${tcol(t.k)}"><span class="dot"></span>${TEAMS[t.k][0]}<b>${t.score + (v.add || 0)}</b>${v.prog ? `<small>${v.prog}</small>` : ''}</div>`; }).join('');
}

  $('#overTitle').textContent = r.solo ? r.solo.score + ' puntos' : !top ? 'Fin' : tie ? 'Empate' : top.ids.includes(myId) ? 'Habéis ganado' : 'Gana ' + TEAMS[top.k][0];
  $('#rank').innerHTML = r.rank.map((x, i) => {
    const turns = r.hist.filter(h => h.t === x.i).map(h =>
      `<div class="tl"><p>${s.rounds > 1 ? `Ronda ${h.r + 1} · ` : ''}pistas de ${esc(pl(h.d).name)}: <b>${h.total}</b>${h.bonus ? ` (${h.bonus} por tiempo)` : ''}</p>${h.L.length ? wordList(h.L, true) : ''}</div>`).join('');
    return `<li><details class="who" ${r.rank.length === 1 ? 'open' : ''}><summary><span class="n">${r.rank.length > 1 ? i + 1 : ''}</span><span class="dot" style="${tcol(x.k)}"></span>` +
      `<div><b>${r.rank.length > 1 ? TEAMS[x.k][0] : esc(names(x.ids))}</b><small>${r.rank.length > 1 ? esc(names(x.ids)) + ' · ' : ''}${x.score} puntos</small></div></summary>${turns}</details></li>`;
  }).join('');
  const b = $('#btnAgain'); b.textContent = 'Jugar de nuevo';
  b.onclick = () => { if (isHost) { const p = byId('host'); if (p) { p.back = true; push(); } } else act({ t: 'again' }); };
  $('#btnExit').hidden = false;
  $('#overHint').textContent = r.solo ? (r.solo.isNew ? '¡Nuevo récord!' : 'Récord: ' + r.solo.rec + ' puntos') : '';
}

let msgTm = 0;
function say(text, cls) { const m = $('#msg'); m.textContent = text; m.className = cls || ''; clearTimeout(msgTm); msgTm = setTimeout(() => { m.textContent = ''; m.className = ''; }, 2600); }
function stageFx(cls) { const st = $('#stage'); st.classList.remove('shake', 'win'); void st.offsetWidth; st.classList.add(cls); }
// a la vez, cada uno solo ve los efectos de la carrera que tiene en pantalla; del resto, un aviso
const here = t => { const c = S && S.cur; if (!c || c.pw || t === undefined) return true; const u = viewRun(); return !u || u.t === t; };
function showEvent(e) {
  if (e.k === 'join') { play('join'); say(e.name + ' entra'); }
  else if (e.k === 'left') { play('left'); say(e.name + (e.kicked ? ' expulsado' : ' se va')); }
  else if (e.k === 'go') play('turn');
  else if (e.k === 'ok') {
    if (here(e.t)) { play('ok'); say(`${e.w} · +${e.pts}${S && S.cur && S.cur.pw ? ' para ' + tname(e.t) : ''}`, 'ok'); stageFx('win'); }
  } else if (e.k === 'no') { if (here(e.t)) { play('bad'); stageFx('shake'); } }
  else if (e.k === 'pass') { if (here(e.t)) { play('left'); say('Pasapalabra'); } }
  else if (e.k === 'all') { if (here(e.t)) { play('bonus'); say(`¡Todas! +${e.bonus} por tiempo`, 'ok'); } else say(`${tname(e.t)} ha terminado`); }
  else if (e.k === 'slow') { play('left'); say(`${tname(e.t)} no ${e.step === 'c' ? 'da la pista' : 'responde'} a tiempo`); }
  else if (e.k === 'miss') { play('boom'); say(`Nadie la saca: ${e.w}`, 'bad'); }
  else if (e.k === 'time') play('boom');
}

// reloj
(function loop() {
  requestAnimationFrame(loop);
  if (!S) return;
  const rem = Math.max(0, endAt - now()), sec = Math.ceil(rem / 1000), c = S.cur;
  if (S.phase === 'play' && c) {
    $('#fuse').firstElementChild.style.width = Math.max(0, Math.min(100, rem / total * 100)) + '%';
    if (c.pw) {
      const z = c.pw.ts[c.pw.who], ss = Math.ceil(Math.max(0, pwEnd - now()) / 1000);
      $('#clock').textContent = `${sec} s · ${tname(z.t)} ${c.pw.step === 'c' ? 'da pista' : 'responde'}: ${ss} s`;
    } else { const u = viewRun(); $('#clock').textContent = u && u.done ? `${sec} s` : `${sec} s · ${u ? u.pts : 0} puntos`; }
    if (sec !== lastSec && sec <= 5 && sec > 0) play('tick', true);
  } else if (S.phase === 'prep') $('#prepClock').textContent = sec > 0 ? `Empieza solo en ${sec} s` : '';
  lastSec = sec;
})();

// ---------- eventos ----------
for (const id of ['#howHome', '#howLobby']) $(id).innerHTML = HOW;
const nameIn = $('#name');
nameIn.value = localStorage.getItem('jt_name') || '';
const params = new URLSearchParams(location.search);
const inviteCode = (params.get('sala') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
if (inviteCode.length === 4) { $('#homeCreate').hidden = true; $('#homeInvite').hidden = false; $('#inviteCode').textContent = inviteCode; }
$('#gameSw').addEventListener('click', e => { const b = e.target.closest('button[data-g]'); if (b) switchGame(b.dataset.g); });
if (params.get('e') === 'k') setHome('Te han expulsado de la sala.', 'bad');

function getName() {
  const n = nameIn.value.trim();
  if (!n) { setHome('Escribe tu nombre.', 'bad'); nameIn.focus(); return null; }
  localStorage.setItem('jt_name', n); myName = n; setHome(''); return n;
}
function busy() { for (const b of ['#btnCreate', '#btnJoin', '#btnJoinInvite']) $(b).disabled = true; setHome('Conectando…'); }
$('#btnCreate').onclick = () => { if (getName()) { busy(); createRoom(); } };
$('#btnJoinOpen').onclick = () => { $('#homeCreate').hidden = true; $('#homeJoin').hidden = false; setHome(''); $('#codeIn').focus(); };
$('#btnJoinBack').onclick = () => { $('#homeJoin').hidden = true; $('#homeCreate').hidden = false; setHome(''); };
$('#btnJoin').onclick = () => {
  const c = $('#codeIn').value.toUpperCase().replace(/[^A-Z]/g, '');
  if (c.length !== 4) { setHome('El código tiene 4 letras.', 'bad'); return; }
  if (getName()) { busy(); joinRoom(c); }
};
$('#btnJoinInvite').onclick = () => { if (getName()) { busy(); joinRoom(inviteCode); } };
$('#btnCopy').onclick = async () => {
  const b = $('#btnCopy');
  try { await navigator.clipboard.writeText(link()); b.textContent = 'Copiado'; } catch (e) { prompt('Copia el enlace:', link()); }
  setTimeout(() => b.textContent = 'Copiar enlace', 1500);
};
if (navigator.share) { $('#btnShare').hidden = false; $('#btnShare').onclick = () => navigator.share({ title: 'Pistas', url: link() }).catch(() => {}); }
$('#btnStart').onclick = startGame;
$('#btnLeave').onclick = leave;
$('#btnExit').onclick = leave;
$('#myRole').addEventListener('click', e => { const b = e.target.closest('button[data-role]'); if (b) act({ t: 'role', r: b.dataset.role }); });
$('#btnMix').onclick = () => { if (isHost) mixTeams(); };
$('#cfgSet').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b || !isHost) return;
  const k = b.dataset.k, i = +b.dataset.i;
  setSetting(k, { letters: LET_OPTS, time: TIME_OPTS, rounds: ROUND_OPTS, diff: DIFF_OPTS, mode: MODES }[k][i]);
});
$('#teams').addEventListener('click', e => {
  const k = e.target.closest('[data-kick]'); if (k && isHost) { kick(k.dataset.kick); return; }
  const mv = e.target.closest('[data-mv]'); if (mv && isHost) { moveTeam(+mv.dataset.mv, +mv.dataset.d); return; }
  const t = e.target.closest('[data-team]'); if (t) act({ t: 'team', k: +t.dataset.team });
});
$('#btnGo').onclick = () => act({ t: 'go' });
$('#btnSwap').onclick = () => act({ t: 'swap' });
$('#btnPass').onclick = () => { if (!$('#btnPass').disabled) act({ t: 'pass' }); };
$('#cform').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#clueIn').value.trim(); if (!v || !can().clue) return;
  const r = clueCheck(v, { w: '', alts: [] });   // la comprobación contra la palabra la hace el anfitrión
  if (r.e) { play('bad'); say(r.e, 'bad'); return; }
  lastClue = v; $('#clueIn').value = ''; act({ t: 'clue', c: v });
  $('#clueIn').focus();
});
$('#word').addEventListener('input', e => {
  if (!can().guess) { e.target.value = ''; typed = ''; renderTiles(); return; }
  typed = e.target.value.slice(0, 30); renderTiles(); sendTyping();
});
let typAt = 0, typTm = 0;
function sendTyping() {   // como mucho cuatro avisos por segundo: los demás solo ven el texto en vivo
  const t = now();
  clearTimeout(typTm);
  if (t - typAt >= 250) { typAt = t; act({ t: 'typing', text: typed }); }
  else typTm = setTimeout(() => { typAt = now(); act({ t: 'typing', text: typed }); }, 260);
}
$('#gform').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#word').value.trim(); if (!v || !can().guess) return;
  clearTimeout(typTm); act({ t: 'guess', w: v });
  $('#word').value = ''; typed = ''; renderTiles();
});
$('#word').addEventListener('focus', renderTiles);
$('#word').addEventListener('blur', renderTiles);
// un toque en la tarjeta devuelve el foco al campo de quien adivina (y el teclado)
document.addEventListener('click', e => {
  if (!S || S.phase !== 'play' || $('#game').hidden || !$('#over').hidden) return;
  if (e.target.closest('button, a, summary, details, input')) return;
  const cn = can(); if (cn.guess) $('#word').focus(); else if (cn.clue && e.target.closest('#stage')) $('#clueIn').focus();
});
addEventListener('keydown', e => {
  if (!S || S.phase !== 'play' || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  const cn = can(), a = document.activeElement;
  if (cn.guess && a !== $('#word')) $('#word').focus();
  else if (cn.clue && a !== $('#clueIn')) $('#clueIn').focus();
});
for (const b of document.querySelectorAll('.snd')) b.onclick = () => {
  unlock(); SND.mute = !SND.mute;
  try { localStorage.setItem('jt_mute', SND.mute ? '1' : '0'); } catch (e) {}
  paintSnd(); play('join');
};
addEventListener('pointerdown', unlock, true);
addEventListener('keydown', unlock, true);
paintSnd();
$('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnJoin').click(); });
{
  const hostCode = (params.get('host') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  if (hostCode.length === 4 && nameIn.value.trim()) { getName(); busy(); createRoom(hostCode); }
  else if (inviteCode.length === 4 && params.get('go') === '1' && nameIn.value.trim()) { getName(); busy(); autoJoin = true; joinRoom(inviteCode); }
}
addEventListener('pagehide', () => { if (net.clients.length && !switching) netPub(isHost ? 'all' : 'host', { t: isHost ? 'closed' : 'bye' }); });
nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') (inviteCode.length === 4 ? $('#btnJoinInvite') : $('#btnCreate')).click(); });
})();
</script>
</body>
</html>
