<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffd93d">
<title>pg games</title>
<meta property="og:title" content="pg games">
<meta property="og:description" content="Juegos cortos para jugar con amigos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd93d'/%3E%3Ccircle cx='30' cy='37' r='20' fill='%2317140f'/%3E%3Ccircle cx='50' cy='13' r='6' fill='%23ff5c8a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
<style>
.wrap{padding-top:max(40px,env(safe-area-inset-top))}
h1{font-size:clamp(72px,24vw,132px);margin:0 0 40px}
h1 span{display:block}
h1 span+span{margin-left:.6em}
.game{display:flex;align-items:center;gap:18px;padding:16px 20px;background:var(--white);border:var(--line);border-radius:18px;box-shadow:var(--hard);
  text-decoration:none;transition:transform .12s,box-shadow .12s}
.game+.game{margin-top:16px}
.game:hover{transform:rotate(-1.2deg) translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.game:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.game svg{width:64px;height:auto;flex:0 0 auto}
.game b{display:block;font-size:44px;font-weight:800;font-stretch:75%;letter-spacing:-.02em;line-height:1}
.game small{font-size:16px;font-weight:500}
.spark{transform-origin:170px 32px;animation:flick .3s infinite alternate}
@keyframes flick{to{transform:scale(.7) rotate(20deg)}}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="display"><span>pg</span><span>games</span></h1>
  <a class="game" href="bomba/">
    <svg viewBox="0 0 200 220" aria-hidden="true">
      <path d="M122 58C132 36 150 30 166 34" fill="none" stroke="#17140f" stroke-width="9" stroke-linecap="round"/>
      <circle cx="100" cy="128" r="76" fill="#17140f"/>
      <rect x="84" y="46" width="40" height="26" rx="6" fill="#17140f"/>
      <path d="M58 108C62 90 76 78 92 74" fill="none" stroke="#fffef8" stroke-opacity=".35" stroke-width="9" stroke-linecap="round"/>
      <g class="spark"><polygon transform="translate(170 32)" points="0,-18 5,-6 18,0 5,6 0,18 -5,6 -18,0 -5,-6" fill="#ff5c8a"/></g>
    </svg>
    <span><b>Bomba</b><small>2 a 8 jugadores</small></span>
  </a>
  <a class="game" href="tutti/">
    <svg viewBox="0 0 200 220" aria-hidden="true">
      <rect x="22" y="40" width="156" height="156" rx="30" fill="#ff5c8a" stroke="#17140f" stroke-width="12" transform="rotate(-8 100 118)"/>
      <path d="M62 92h76M62 124h76M62 156h44" stroke="#17140f" stroke-width="12" stroke-linecap="round" transform="rotate(-8 100 118)"/>
    </svg>
    <span><b>Tutti frutti</b><small>2 a 8 jugadores</small></span>
  </a>
</main>
</body>
</html>
