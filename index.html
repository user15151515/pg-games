<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffd93d">
<title>pg games</title>
<meta name="description" content="Juegos cortos para jugar con amigos.">
<link rel="canonical" href="https://games.pgfantasy.cat/">
<meta property="og:type" content="website">
<meta property="og:title" content="pg games">
<meta property="og:description" content="Juegos cortos para jugar con amigos.">
<meta property="og:url" content="https://games.pgfantasy.cat/">
<meta property="og:image" content="https://games.pgfantasy.cat/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="shared.css">
<style>
.wrap{padding-top:max(40px,env(safe-area-inset-top))}
h1.display{font-size:clamp(56px,19vw,112px);margin:0 0 56px;padding-bottom:.08em;white-space:nowrap}
.game{display:flex;align-items:center;gap:18px;padding:16px 20px;background:var(--white);border:var(--line);border-radius:18px;box-shadow:var(--hard);
  text-decoration:none;transition:transform .12s,box-shadow .12s}
.game+.game{margin-top:16px}
.game:hover{transform:rotate(-1.2deg) translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.game:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.game svg{width:64px;height:auto;flex:0 0 auto}
.game b{display:block;font-size:44px;font-weight:800;font-stretch:75%;letter-spacing:-.02em;line-height:1}
.game small{font-size:16px;font-weight:500}
.spark{transform-origin:170px 32px;animation:flick .3s infinite alternate}
@keyframes flick{to{transform:scale(.7) rotate(20deg)}}
</style>
<script>window.PGT={ev(){},start(){},end(){}}</script>
<script src="pg.js" defer></script>
</head>
<body>
<noscript><p style="padding:20px;font:700 20px system-ui">Los juegos necesitan JavaScript. Actívalo en tu navegador y recarga la página.</p></noscript>
<main class="wrap">
  <h1 class="display">pg games</h1>
  <a class="game" href="bomba/">
    <svg viewBox="0 0 200 220" aria-hidden="true">
      <path d="M122 58C132 36 150 30 166 34" fill="none" stroke="#17140f" stroke-width="9" stroke-linecap="round"/>
      <circle cx="100" cy="128" r="76" fill="#17140f"/>
      <rect x="84" y="46" width="40" height="26" rx="6" fill="#17140f"/>
      <path d="M58 108C62 90 76 78 92 74" fill="none" stroke="#fffef8" stroke-opacity=".35" stroke-width="9" stroke-linecap="round"/>
      <g class="spark"><polygon transform="translate(170 32)" points="0,-18 5,-6 18,0 5,6 0,18 -5,6 -18,0 -5,-6" fill="#ff5c8a"/></g>
    </svg>
    <span><b>Bomba</b><small>1 a 8 jugadores</small></span>
  </a>
  <a class="game" href="tutti/">
    <svg viewBox="0 0 200 220" aria-hidden="true">
      <rect x="22" y="40" width="156" height="156" rx="30" fill="#ff5c8a" stroke="#17140f" stroke-width="12" transform="rotate(-8 100 118)"/>
      <path d="M62 92h76M62 124h76M62 156h44" stroke="#17140f" stroke-width="12" stroke-linecap="round" transform="rotate(-8 100 118)"/>
    </svg>
    <span><b>Tutti frutti</b><small>2 a 8 jugadores</small></span>
  </a>
  <a class="game" href="teclazo/">
    <svg viewBox="0 0 64 38" aria-hidden="true" style="color:#ff5c8a"><rect x="3" y="15" width="58" height="15" rx="6" fill="currentColor" stroke="#17140f" stroke-width="3"/><path d="M16 15L22 5H42L50 15Z" fill="currentColor" stroke="#17140f" stroke-width="3" stroke-linejoin="round"/><path d="M22 14L26 8H33V14ZM36 14V8H41L45 14Z" fill="#fffef8" stroke="#17140f" stroke-width="1.5" stroke-linejoin="round"/><circle cx="17" cy="31" r="6" fill="#17140f"/><circle cx="47" cy="31" r="6" fill="#17140f"/><circle cx="17" cy="31" r="2" fill="#fffef8"/><circle cx="47" cy="31" r="2" fill="#fffef8"/></svg>
    <span><b>Teclazo</b><small>1 a 8 jugadores</small></span>
  </a>
</main>
</body>
</html>
